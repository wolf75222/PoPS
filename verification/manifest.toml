# Scientific campaign source of truth for the monorepo.
# Distinct from tests/test_manifest.toml and benchmarks/manifest.toml;
# do not duplicate those authorities (plan §2.1–2.2, §36).

schema = "pops.verification.manifest.v1"
repository = "wolf75222/PoPS"
max_nodes = 2

[current_capabilities]
exact_native_dimension = true
cartesian_system_runtime = true
polar_system_runtime = false
amr_total_levels_baseline = 3
amr_refinement_ratios_baseline = [2, 2]
hdf5_requires_mpi = true

# Phase 0 dummy plus Phase 1 oracles (uniform 1-d first increment).

[[case]]
id = "PH-00"
path = "verification/cases/infrastructure/dummy_analytic/run.py"
name = "Phase 0 dummy analytic cosine"
verification_kind = "infrastructure"
evidence_status = "required"
physics = []
oracle = "manufactured_cosine"
native_dimensions = [1]
execution_spaces = ["KokkosSerial"]
mpi_modes = ["off"]
suites = ["pr"]
requires = []

[case.resources.pr]
nodes = 1

[case.resources.two_node]
nodes = [1, 2]

[case.acceptance]
finite = true

[[case]]
id = "TR-01"
path = "verification/cases/transport/advection_sine/run.py"
name = "Periodic sine advection (WENO5-Z order campaign; VanLeer TVD variant)"
verification_kind = "code-verification"
evidence_status = "required"
physics = ["scalar_advection"]
oracle = "translated_oblique_sine"
# Order campaign scheme: public WENO5-Z (pops.numerics.reconstruction.WENO5Z).
# VanLeer/MUSCL is a separately labeled TVD variant, not the 1.8 order-2 proof.
# Constant-CFL is global; isolated spatial uses dt∝h². Threshold unchanged.
native_dimensions = [1, 2, 3]
execution_spaces = ["KokkosSerial", "KokkosOpenMP"]
mpi_modes = ["off", "on"]
suites = ["pr", "nightly", "release"]
requires = ["public_case_pipeline", "cartesian_layout", "mpi", "exact_native_dimension"]

[case.resources.pr]
nodes = 1
resolutions = [16, 32, 64, 128]

[case.resources.two_node]
nodes = [1, 2]

[case.acceptance]
spatial_order_min = 1.8
finite = true

