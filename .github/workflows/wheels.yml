# Builds one PREBUILT macOS arm64 / CPython 3.12 PoPS wheel containing the exact native variants
# Dim=1, Dim=2 and Dim=3. Each leaf comes from its own explicit compile-time CMake configuration;
# after cibuildwheel repairs/signs those three mono-Dim wheels, a deterministic assembler combines
# the final bytes, regenerates variants.json and RECORD, then loads every leaf in a fresh process.
# Kokkos is built Serial + STATIC + PIC and linked into every `_pops.*.so`.
#
# Release tags invoke this as a reusable workflow from release.yml.  That caller then installs this
# exact artifact for the complete release gate before it is allowed to create a GitHub Release.  A
# manual dispatch remains available for packaging-only rehearsal; there is no independent tag race.
name: Wheels

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  macos-arm64:
    name: wheel (macOS arm64, cp312)
    runs-on: macos-14  # Apple Silicon (arm64) runner
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        # Pinned (not a floating range): this job ships a redistributable artifact, so its build driver
        # is fixed like ci.yml pins its third-party action by SHA. Bump deliberately.
        run: python -m pip install --upgrade pip "cibuildwheel==2.21.3"

      - name: Install ccache
        run: brew list ccache >/dev/null 2>&1 || brew install ccache

      - name: Resolve Apple toolchain cache identity
        id: apple-platform
        shell: bash
        run: |
          xcode="$(xcodebuild -version | tr '\n' '-')"
          clang="$(clang++ --version | head -n 1)"
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          image="$(sw_vers -productVersion)"
          raw="macos-${image}-${RUNNER_ARCH}-${xcode}-appleclang-${clang}-sdk-${sdk}"
          key="$(printf '%s' "$raw" | tr -c 'A-Za-z0-9._-' '-')"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Cache the Kokkos install (deterministic for a fixed version + commit + flags), so warm runs SKIP
      # the Serial+static+PIC Kokkos build entirely -- CIBW_BEFORE_ALL no-ops on a cache hit. The key
      # carries the pinned commit (15dc143e = tag 4.4.01) and the build flags, AND hashFiles(this
      # workflow): any edit to a Kokkos flag here rolls the key (no stale-flag reuse) and editing the
      # file is the escape hatch from a bad cache. The exact macOS image, architecture, Xcode,
      # AppleClang and SDK identity also participate: a static archive is never reused across an
      # unproven compiler/SDK boundary.
      - name: Cache Kokkos install (macOS arm64, Serial static PIC)
        id: kokkos-cache
        uses: actions/cache@v6
        with:
          path: /tmp/kokkos-install
          key: kokkos-wheel-${{ steps.apple-platform.outputs.key }}-4.4.01-15dc143e-serial-static-pic-cxx20-dt11-${{ hashFiles('.github/workflows/wheels.yml') }}

      # ccache for the heavy -O3 _pops TUs. Rolling key (sha) + restore-keys reuse the most recent cache.
      # cibuildwheel builds in a temp dir, so CCACHE_BASEDIR + CCACHE_NOHASHDIR (set in CIBW_ENVIRONMENT)
      # are what give cross-run hits; the actual warm hit-rate is reported by the `ccache -s` step below.
      - name: Cache ccache (wheel)
        uses: actions/cache@v6
        with:
          path: ~/.cache/pops-wheel-ccache
          key: ccache-wheel-macos-arm64-${{ github.sha }}
          restore-keys: |
            ccache-wheel-macos-arm64-

      # cibuildwheel builds cp312-macosx_arm64 in an isolated env. CIBW_BEFORE_ALL runs ONCE on the
      # runner (macOS builds are native, not containerized), installing a Serial+static+PIC Kokkos that
      # find_package(Kokkos) then links INTO _pops -> the wheel carries no external Kokkos dylib.
      # POPS_HEAVY_MODULE_TU_POOL=2: post-split (ADC-335/342/359) the heavy module TUs are SMALL sub-TUs, so two
      # -O3 compiles fit the ~7 GB / 3-vCPU runner; the original pool=1 OOM guard (for the old monolithic
      # system.cpp / amr_system.cpp) made the serial build ~1 h here. MACOSX_DEPLOYMENT_TARGET=11.0 keeps
      # the wheel installable on older macOS than the runner SDK.
      - name: Build and assemble exact Dim=1/2/3 wheel (cibuildwheel)
        env:
          CIBW_BUILD: cp312-macosx_arm64
          CIBW_ARCHS_MACOS: arm64
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          # Keep repair explicit: the assembler accepts only these final repaired/ad-hoc-signed
          # Mach-O bytes and recomputes both the native manifest hashes and wheel RECORD from them.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
          # Builds Kokkos ONLY on a cache miss (the install dir is restored above otherwise). The clone
          # is retried (a transient network blip must not waste a multi-hour build) and its checkout is
          # asserted against the pinned commit of tag 4.4.01 (detects a re-pointed tag -- supply chain).
          # -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 is explicit so Kokkos targets 11.0 regardless of env
          # inheritance, matching the _pops target (no static-archive min-version skew).
          CIBW_BEFORE_ALL: |
            set -e
            if [ ! -f /tmp/kokkos-install/lib/cmake/Kokkos/KokkosConfig.cmake ]; then
              for i in 1 2 3; do
                git clone --depth 1 -b 4.4.01 https://github.com/kokkos/kokkos.git /tmp/kokkos && break
                echo "kokkos clone failed (attempt $i/3), retrying..."; rm -rf /tmp/kokkos; sleep 10
              done
              test "$(git -C /tmp/kokkos rev-parse HEAD)" = "15dc143e5f39949eece972a798e175c4b463d4b8"
              cmake -S /tmp/kokkos -B /tmp/kbuild \
                -DKokkos_ENABLE_SERIAL=ON \
                -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_INSTALL_PREFIX=/tmp/kokkos-install \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build /tmp/kbuild --target install -j3
            fi
            test -f /tmp/kokkos-install/lib/cmake/Kokkos/KokkosConfig.cmake
          # ccache wraps the heavy -O3 _pops compiles. COMPILERCHECK=content keys on the compiler binary
          # (not its mtime); MAXSIZE bounds the cached dir so it cannot crowd out the Kokkos cache under
          # the repo's 10 GB budget. CAVEAT: cibuildwheel builds under a per-run temp dir, so the absolute
          # source/-I paths vary run-to-run and CCACHE_BASEDIR cannot fully normalise them -- cross-run
          # hits may be low. The `ccache -s` step measures it; if it stays ~0, the real lever is a
          # persistent scikit-build-core build-dir (deferred, see ADC-367). The Kokkos-install cache above
          # is the reliable win regardless.
          CIBW_ENVIRONMENT: >
            Kokkos_ROOT=/tmp/kokkos-install
            CMAKE_PREFIX_PATH=/tmp/kokkos-install
            MACOSX_DEPLOYMENT_TARGET=11.0
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
            CCACHE_DIR=$HOME/.cache/pops-wheel-ccache
            CCACHE_BASEDIR=$HOME
            CCACHE_MAXSIZE=2G
            CCACHE_NOHASHDIR=1
            CCACHE_COMPILERCHECK=content
            CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,pch_defines
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          variant_wheels=()
          for dim in 1 2 3; do
            output_dir="$PWD/wheel-leaves/dim${dim}"
            mkdir -p "$output_dir"
            # delocate may rewrite/sign the Mach-O after CMake emitted the mono-Dim manifest. In the
            # disposable test venv, resolve only the manifest-declared leaf, explicitly sign it,
            # regenerate its row by loading those exact bytes, recheck signature+hash, then import.
            # The assembler independently proves the untouched repaired wheel archive afterwards.
            CIBW_CONFIG_SETTINGS="cmake.define.POPS_NATIVE_DIM=${dim} cmake.define.POPS_HEAVY_MODULE_TU_POOL=2" \
            CIBW_TEST_COMMAND="native_leaf=\"\$(python -c 'import importlib.util,json,sys; from pathlib import Path,PurePosixPath; sys.path.insert(0, \"{project}/scripts\"); from write_native_variant_manifest import validate_manifest_payload; spec=importlib.util.find_spec(\"pops\"); assert spec is not None; roots=tuple(spec.submodule_search_locations or ()); assert len(roots)==1; manifest=Path(roots[0])/\"_native\"/\"variants.json\"; rows=validate_manifest_payload(json.loads(manifest.read_text()), expected_dimensions=(${dim},)); leaf=manifest.parent.joinpath(*PurePosixPath(rows[0][\"path\"]).parts); assert leaf.is_file() and not leaf.is_symlink(); print(leaf.resolve())')\" && \
              native_manifest=\"\$(dirname \"\$(dirname \"\$native_leaf\")\")/variants.json\" && \
              codesign --force --sign - \"\$native_leaf\" && \
              python {project}/scripts/write_native_variant_manifest.py --extension \"\$native_leaf\" --manifest \"\$native_manifest\" --dimension ${dim} --version \"\$(python -c 'import importlib.metadata; print(importlib.metadata.version(\"pops\"))')\" && \
              python {project}/scripts/codesign_pops_extensions.py --expect-dim ${dim} && \
              python {project}/scripts/verify_installed_native.py --expect-dim ${dim} --expect-serial" \
              python -m cibuildwheel --output-dir "$output_dir"
            built=("$output_dir"/pops-*.whl)
            test "${#built[@]}" -eq 1
            variant_wheels[$dim]="${built[0]}"
          done

          wheel_name="$(basename "${variant_wheels[1]}")"
          for dim in 2 3; do
            test "$(basename "${variant_wheels[$dim]}")" = "$wheel_name"
          done
          mkdir -p "$PWD/wheelhouse"
          python scripts/assemble_native_variant_wheel.py \
            --variant "1=${variant_wheels[1]}" \
            --variant "2=${variant_wheels[2]}" \
            --variant "3=${variant_wheels[3]}" \
            --output "$PWD/wheelhouse/$wheel_name" \
            --python "$(command -v python)" \
            --expect-mpi off \
            --expect-kokkos on \
            --signature-policy adhoc
          assembled=("$PWD"/wheelhouse/pops-*.whl)
          test "${#assembled[@]}" -eq 1

      - name: ccache stats (wheel)
        if: always()
        # Surfaces the warm-run hit-rate. If it stays near zero across runs, cibuildwheel's per-build
        # temp source path is defeating CCACHE_BASEDIR -> the next lever is a persistent scikit-build-core
        # build-dir cache (deferred: higher cross-runner cmake-cache risk).
        run: CCACHE_DIR="$HOME/.cache/pops-wheel-ccache" ccache -s

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: pops-macos-arm64-cp312
          path: wheelhouse/*.whl
          if-no-files-found: error
