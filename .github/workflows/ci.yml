name: CI

# adc_cpp est KOKKOS-ONLY : Kokkos est le seul backend on-node (Serial / OpenMP / Cuda selon
# l'install Kokkos). Il n'existe plus de build non-Kokkos -- TOUS les jobs configurent avec
# -DPOPS_USE_KOKKOS=ON. Topologie (ADC-171) :
#  - changes records one PR merge-base diff, including renames/deletions, as ci-input.
#  - set-mode publishes the shared component/consumer plan and only nonempty stable shard ids.
#    Source-only plans avoid native builds; unknown inputs conservatively select complete coverage.
#  - gate-cpp + gate-python-architecture + gate-python consume that plan. Native jobs remain
#    Kokkos Serial, with authenticated build artifacts and required aggregate verdicts.
#  - ci-full (push master, nightly cron, workflow_dispatch, ou PR portant le label `ci-full`) :
#    ajoute MPI (+ Kokkos Serial) et Kokkos OpenMP, la suite COMPLETE. INCHANGE par ADC-171.
# Aucun test n'est supprime : seuls les declencheurs et le cache changent. Le serie passe par
# Kokkos Serial (Kokkos_ENABLE_SERIAL=ON), le multi-thread par Kokkos OpenMP (Kokkos_ENABLE_OPENMP).
#
# ADC-548 COMPLIANCE MAP -- job ownership. See docs/development/change_aware_ci.md
# for component selection, dependency closure and conservative fallback policy.
#  (a) EXPLICIT NAMED JOBS per compliance dimension:
#      - architecture gates      -> gate-python-architecture (source-only compliance proof:
#        selected consumer/source fences from ci-plan/architecture-tests.txt; full plans cover
#        the complete directory, and new unmapped inputs receive conservative coverage).
#      - unit families           -> gate-python shards 0..N (duration-packed; tests/python/unit/**
#        via impacted selection). The shard job NAME "... shard N" is a required-check contract.
#      - codegen / manifest / cache-ABI -> gate-python-compile-cache (the dedicated DSL compile-cache
#        job: it write/verify-keys the <so>.cachekey sidecar, the manifest and the backend/ABI cache
#        key across up to 8 real native compiles).
#      - generated-program compile + bind SMOKE -> gate-python-compile-cache (the 8 real DSL native
#        compiles ARE the compile/bind smoke: emit -> .so -> load).
#      - bind-RUN / ProgramContext execution SMOKE -> kokkos-openmp (the add_native_block route:
#        test_native_abi_std / test_dsl_production / test_dsl_production_amr actually RUN a compiled
#        Program). Fast lane carries the compile-BIND proof; the full lane carries the bind-RUN proof.
#  (b) DEBUG ARTIFACTS ON CODEGEN FAILURE: the codegen-running jobs (gate-python-compile-cache and the
#      gate-python shards) export POPS_KEEP_GENERATED=1 into a known POPS_CACHE_DIR and, on failure,
#      upload the ADC-536 provenance sidecars -- the generated .cpp (banner = serialized IR + hashes +
#      flags + toolchain + REDACTED compile command) and the .cachekey -- as a debug artifact. The
#      banner is redacted and sidecar-only, so it never leaks a secret and never enters the .so bytes.
#  (c) LEGACY TESTS separated from the compliance proof: the compliance proof (gate-python-architecture)
#      is SOURCE-ONLY and never imports/executes the functional or legacy-surface tests, so it cannot
#      be contaminated. Functional tests (incl. the legacy System-coupler / reference-oracle C++
#      surface) live in the unit/integration shards and the full lanes, kept distinct BY JOB. No
#      separate legacy lane exists or is warranted today.
#  (d) SLOW MATRICES named and documented: mpi (MPI + Kokkos Serial, ctest -L mpi) and kokkos-openmp
#      (Kokkos OpenMP + the native-ABI bind-RUN route). Complete plans cover non-PR events,
#      explicit overrides, shared build/core inputs and unresolved impact. MPI also runs for
#      affected collective contracts without requiring an unrelated OpenMP matrix.
on:
  # The release workflow calls this exact matrix for the tagged commit.  A tag therefore cannot
  # publish merely because the macOS wheel is healthy while one of the declared Linux source
  # routes (Serial, OpenMP, or MPI) is broken.
  workflow_call:
    inputs:
      force_full:
        description: Run the complete Serial, OpenMP, and MPI source matrix.
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tutorials/**'
      - '.gitignore'
  pull_request:
    # Types par defaut (opened, synchronize, reopened) PLUS labeled : poser le label
    # `ci-kokkos` ou `ci-full` sur une PR re-declenche le workflow. Sans `labeled`, ajouter
    # un label ne relance aucun run.
    types: [opened, synchronize, reopened, labeled]
    # NO paths-ignore on pull_request: the `gate` job is a REQUIRED status check (branch
    # protection on master). A required check that never runs blocks the PR forever, so the
    # workflow must trigger on EVERY PR to report `gate`. The internal routing (the `changes`
    # job + per-job `if:`) still skips the expensive Kokkos builds for plans without native consumers,
    # so the gate just reports fast. The `push` trigger keeps its paths-ignore (no gate needed there).
  schedule:
    # Suite complete chaque nuit (03:17 UTC) meme sans push, pour attraper toute
    # derive d'environnement (image runner, deps apt) hors du chemin critique des PR.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # Sur une PR, un nouveau push annule le run precedent encore en vol : on n'immobilise
  # pas les runners lents sur une revision deja perimee.
  # Sur un push master (et nightly/dispatch), on n'annule PAS : des merges rapproches se
  # couperaient mutuellement leurs builds Kokkos lents (interruption SIGTERM, exit 143),
  # marquant master en faux rouge alors que le code est sain. Chaque validation post-merge
  # va donc a son terme (les runs se mettent en file au lieu de s'annuler).
  group: pops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Collect once; every selector consumes the same merge-base-aware input artifact.
  changes:
    name: routage (chemins modifies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Record changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci_plan.py changes \
            --event-name "$EVENT_NAME" \
            --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" \
            --output-file ci-input/changed-files.txt
      # MG6: the ledger of master's tutorials (MG8) records no more than the base does, and each
      # of its causes cites commits of the history that change more than tests. Every event runs
      # it, so a PR cannot grow the ledger even when its plan skips the tutorials.
      - name: Check the MG8 ledger against the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=()
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base=(--check-base "$BASE_SHA")
          fi
          python3 scripts/run_mg8_tutorials.py check --source . --verify-commits "${base[@]}"
      - name: Upload shared changed files
        uses: actions/upload-artifact@v7
        with:
          name: ci-input
          path: ci-input/changed-files.txt
          if-no-files-found: error

  # One planner owns required jobs, stable shard ids, source-only fences and full overrides.
  # The aggregate consumes these same outputs and rejects missing or skipped required jobs.
  set-mode:
    name: mode (fast/full)
    runs-on: ubuntu-latest
    needs: changes
    outputs:
      full: ${{ steps.decide.outputs.full }}
      cpp_required: ${{ steps.decide.outputs.cpp_required }}
      python_required: ${{ steps.decide.outputs.python_required }}
      architecture_required: ${{ steps.decide.outputs.architecture_required }}
      mpi_required: ${{ steps.decide.outputs.mpi_required }}
      openmp_required: ${{ steps.decide.outputs.openmp_required }}
      compile_cache_required: ${{ steps.decide.outputs.compile_cache_required }}
      cpp_prewarm_required: ${{ steps.decide.outputs.cpp_prewarm_required }}
      cpp_matrix: ${{ steps.decide.outputs.cpp_matrix }}
      python_matrix: ${{ steps.decide.outputs.python_matrix }}
      python_dimensions: ${{ steps.decide.outputs.python_dimensions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          name: ci-input
          path: ci-input
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_KOKKOS: ${{ contains(github.event.pull_request.labels.*.name, 'ci-kokkos') }}
          CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
          FORCE_FULL: ${{ inputs.force_full || false }}
        run: |
          python3 scripts/ci_plan.py plan \
            --changed-files ci-input/changed-files.txt \
            --event-name "$EVENT_NAME" \
            --ci-kokkos "$CI_KOKKOS" --ci-full "$CI_FULL" \
            --force-full "$FORCE_FULL" \
            --output-dir ci-plan --github-output "$GITHUB_OUTPUT"
      - name: Upload shared execution plan
        uses: actions/upload-artifact@v7
        with:
          name: ci-plan
          path: ci-plan/
          if-no-files-found: error

  # PREWARM C++ NATIF. Trois runners compilent une partition exacte et disjointe des objets runtime
  # communs a tous les shards. Ils publient uniquement des entrees ccache et leur contrat exact
  # compilateur/flags/revision/sources. Les shards reconfigurent ensuite eux-memes le graphe officiel,
  # authentifient ces contrats, compilent leurs executables distincts et executent leurs propres tests.
  # Le prewarm ne publie donc aucun binaire et ne peut masquer ni un objet absent ni un changement ABI.
  gate-cpp-prewarm:
    name: ubuntu-latest / Kokkos Serial (C++ prewarm ${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, set-mode]
    if: needs.set-mode.outputs.cpp_prewarm_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        lane: [system, amr-runtime, amr-fields]

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-cpp-prewarm
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: locale
      KOKKOS_PREFIX: ${{ github.workspace }}/.kokkos-install

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: kokkos
        uses: ./.github/actions/setup-kokkos
        with:
          extra-apt: mold

      - name: Prewarm production runtime objects (${{ matrix.lane }})
        run: |
          source scripts/ci_heartbeat.sh
          lane_parallelism=4
          lane_watchdog=18m
          case "${{ matrix.lane }}" in
            system)
              lane_parallelism=2
              lane_watchdog=24m
              ;;
            amr-runtime|amr-fields) lane_parallelism=2 ;;
          esac
          export NINJA_STATUS='[%f/%t elapsed=%es active=%r] '
          cmake --preset ci-kokkos -DCMAKE_LINKER_TYPE=MOLD \
            -DPOPS_HEAVY_TEST_TU_POOL="$lane_parallelism" \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=${{ github.workspace }}=."
          python3 scripts/ci_python_module_objects.py --build-dir build-kokkos --verify
          ccache --zero-stats
          mapfile -t object_targets < <(
            python3 scripts/ci_python_module_objects.py \
              --build-dir build-kokkos \
              --lane "${{ matrix.lane }}" \
              --contract-file "$RUNNER_TEMP/cpp-prewarm-contract-${{ matrix.lane }}.json"
          )
          test "${#object_targets[@]}" -gt 0
          run_with_heartbeat "C++ prewarm ${{ matrix.lane }}" "$lane_watchdog" \
            cmake --build --preset ci-kokkos --parallel "$lane_parallelism" \
              --target "${object_targets[@]}"
          ccache -s
          tar -C "$CCACHE_DIR" -cf "$RUNNER_TEMP/cpp-prewarm-ccache-${{ matrix.lane }}.tar" .

      - name: Upload C++ prewarm cache and compile contract
        uses: actions/upload-artifact@v7
        with:
          name: gate-cpp-prewarm-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/cpp-prewarm-ccache-${{ matrix.lane }}.tar
            ${{ runner.temp }}/cpp-prewarm-contract-${{ matrix.lane }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # GATE C++ (ADC-171). Les cibles selectionnees sont partitionnees en dix shards deterministes
  # dont l'union est verifiee par ci_select_tests.py avant exposition au workflow. Chaque shard
  # authentifie et reutilise le socle prechauffe, construit ses cibles explicites puis applique la
  # regex CTest du meme shard : aucune compilation runtime commune n'est multipliee dix fois.
  gate-cpp-shards:
    name: ubuntu-latest / Kokkos Serial (C++) shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Runtime objects are prewarmed in parallel above. Keep an 18-minute bounded final build for
    # contract verification, ccache hits, shard-owned test executables and links, then seven minutes
    # for tests. A cold common runtime can no longer consume this watchdog independently fifteen times.
    # Three additional Field contract suites require fifteen shards: fourteen exceed the
    # unchanged 906-second scheduling budget. Per-job watchdogs and catalog costs are unchanged.
    timeout-minutes: 40
    needs: [changes, set-mode, gate-cpp-prewarm]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.set-mode.outputs.cpp_matrix) }}
    # An omitted prewarm is valid only when the shared plan explicitly proves it unnecessary.
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.set-mode.result == 'success' && needs.set-mode.outputs.cpp_required == 'true' &&
      (needs.gate-cpp-prewarm.result == 'success' ||
       (needs.set-mode.outputs.cpp_prewarm_required == 'false' && needs.gate-cpp-prewarm.result == 'skipped'))

    env:
      # Le cache final fusionne les trois partitions runtime puis ajoute les objets de tests du
      # shard. Deux Gio evitent d'evincer le socle authentifie avant son utilisation.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      # ADC-366 ccache cross-run/cross-checkout hit-rate (codegen-neutral, keys unchanged; paired with
      # -ffile-prefix-map on the cmake line below).
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: locale
      # Cle exacte unique par tentative : cache/save peut persister le travail partiel d'un shard
      # apres echec/annulation. Les restore prefixes restent limites au MEME shard (PR puis master) ;
      # aucun fallback vers l'ancien cache monolithique de 1.3 Go, qui serait duplique sept fois.
      # `runner.*` is unavailable in job-level env expressions. Keep the portable suffix here and
      # add the runner OS only at the cache steps, where that context is authenticated by Actions.
      CCACHE_CACHE_KEY: kokkos-serial-shard-${{ matrix.shard }}-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Prefixe FIXE ou Kokkos est installe par l'action composite (meme chemin que kokkos-prefix) ;
      # mis en cache (le gros gain : pas de reconstruction de Kokkos a chaque run). Serial, PIC.
      KOKKOS_PREFIX: ${{ github.workspace }}/.kokkos-install

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download shared execution plan
        uses: actions/download-artifact@v8
        with:
          name: ci-plan
          path: ci-plan

      - name: Select affected C++ tests
        id: test-plan
        run: |
          force_args=()
          if [ "${{ needs.set-mode.outputs.full }}" = "true" ]; then
            force_args+=(--force-all)
          fi
          python3 scripts/ci_select_tests.py cpp \
            --changed-files ci-plan/cpp-changed-files.txt \
            --explain-file "$RUNNER_TEMP/cpp-test-plan.json" \
            --github-output "$GITHUB_OUTPUT" \
            --shard-index "${{ matrix.shard }}" \
            --shard-total 15 \
            "${force_args[@]}"
          cpp_summary=$(grep '^cpp_summary=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          cpp_shard_summary=$(grep '^cpp_shard_summary=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          cpp_areas=$(grep '^cpp_areas=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          {
            echo "### affected C++ tests"
            echo ""
            echo "- ${cpp_summary}"
            echo "- ${cpp_shard_summary}"
            echo "- areas: ${cpp_areas}"
            echo "- plan: artifact \`gate-cpp-test-plan-shard-${{ matrix.shard }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload C++ test plan
        uses: actions/upload-artifact@v7
        with:
          name: gate-cpp-test-plan-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/cpp-test-plan.json

      # Action composite : apt deps (Eigen / Ninja / ccache) + mold, et install Kokkos Serial PIC
      # MISE EN CACHE sous la cle Kokkos image/architecture/GCC exacte -- IDENTIQUE aux jobs full
      # et a quality.yml sur le meme toolchain. mold (editeur de liens rapide) n'est
      # ajoute qu'ici via extra-apt : il n'entre PAS dans les presets (portables pour le dev local mac).
      - id: kokkos
        uses: ./.github/actions/setup-kokkos
        with:
          extra-apt: mold

      # actions/cache est immutable. restore/save separes + cle unique par tentative permettent a
      # l'etape save sous `always()` de conserver les objets compiles avant un echec/une annulation.
      - name: Restore ccache (Kokkos Serial, shard ${{ matrix.shard }})
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CCACHE_CACHE_KEY }}
          restore-keys: |
            ccache-${{ runner.os }}-kokkos-serial-shard-${{ matrix.shard }}-${{ github.ref }}-
            ccache-${{ runner.os }}-kokkos-serial-shard-${{ matrix.shard }}-refs/heads/master-

      - name: Reset ccache stats (Kokkos Serial, shard ${{ matrix.shard }})
        run: ccache --zero-stats

      - name: Download parallel C++ prewarm caches
        if: needs.set-mode.outputs.cpp_prewarm_required == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: gate-cpp-prewarm-*
          path: ${{ github.workspace }}/.pops-ci/cpp-prewarm

      - name: Merge parallel C++ prewarm caches
        if: needs.set-mode.outputs.cpp_prewarm_required == 'true'
        run: |
          mkdir -p "$CCACHE_DIR"
          mapfile -t cache_archives < <(
            find "${{ github.workspace }}/.pops-ci/cpp-prewarm" \
              -name 'cpp-prewarm-ccache-*.tar' -type f | sort
          )
          test "${#cache_archives[@]}" -eq 3
          for cache_archive in "${cache_archives[@]}"; do
            tar -C "$CCACHE_DIR" -xf "$cache_archive"
          done
          ccache --zero-stats

      # Flags du build : CMakePresets.json (preset ci-kokkos) = SOURCE UNIQUE DE VERITE, partagee
      # avec le dev local ; Kokkos_ROOT vient de $KOKKOS_PREFIX (install en cache ci-dessus) et
      # ccache est auto-detecte par le CMakeLists (POPS_USE_CCACHE). Le preset pose aussi
      # POPS_TESTS_FAST_O0=ON pour les executables de test sur grilles minuscules. Les objets runtime
      # partages gardent exactement l'optimisation de production : GCC consomme moins de memoire sur
      # le grand TU AmrSystem a -O3 qu'a -O0. Le pool Ninja pops_heavy_test_tu=1 serialise ces objets
      # et les executables lourds sans reduire le parallelisme des autres cibles.
      # Le pool pops_heavy_module_tu=1 reste reserve au module de production
      # (cf. python/CMakeLists.txt). Parallelisme jobs: 4 (runner public = 4 vCPU) dans les presets.
      # CMAKE_LINKER_TYPE=MOLD : mold pose en -D ICI uniquement (hors presets, cf. extra-apt mold).
      # SECONDS chronometre configure+build puis tests, ecrits dans GITHUB_STEP_SUMMARY (baseline ADC-171).
      - name: Configure + build + test (Kokkos Serial)
        timeout-minutes: 30
        run: |
          SECONDS=0
          source scripts/ci_heartbeat.sh
          export NINJA_STATUS='[%f/%t elapsed=%es active=%r] '
          # -ffile-prefix-map (ADC-366): codegen-neutral path rewrite for ccache cross-checkout hits (see
          # gate-python). CI-only -D; abi_key (compiler+header-content hash) untouched.
          cmake --preset ci-kokkos -DCMAKE_LINKER_TYPE=MOLD \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=${{ github.workspace }}=."
          if [ "${{ needs.set-mode.outputs.cpp_prewarm_required }}" = "true" ]; then
            mapfile -t compile_contracts < <(
              find "${{ github.workspace }}/.pops-ci/cpp-prewarm" \
                -name 'cpp-prewarm-contract-*.json' -type f | sort
            )
            test "${#compile_contracts[@]}" -eq 3
            python3 scripts/ci_python_module_objects.py \
              --build-dir build-kokkos \
              --verify-contracts "${compile_contracts[@]}"
          fi
          read -r -a cpp_targets <<< "${{ steps.test-plan.outputs.cpp_shard_targets }}"
          if [ "${#cpp_targets[@]}" -eq 0 ]; then
            # Shard 0 owns target-less CTest contracts even when affected-test routing
            # assigns it no executable target.
            if [ "${{ matrix.shard }}" = "0" ]; then
              ctest_inventory="$RUNNER_TEMP/ctest-shard-${{ matrix.shard }}.json"
              standalone_regex_file="$RUNNER_TEMP/ctest-standalone-shard-${{ matrix.shard }}.regex"
              ctest --preset ci-kokkos -N --show-only=json-v1 > "$ctest_inventory"
              python3 scripts/ci_select_tests.py verify-cpp-target-labels \
                --ctest-json "$ctest_inventory" \
                --targets "${cpp_targets[@]}" \
                --standalone-regex-file "$standalone_regex_file"
            fi
            echo "No affected C++ tests selected for shard ${{ matrix.shard }}."
            exit 0
          fi
          run_with_heartbeat "Kokkos Serial shard ${{ matrix.shard }} build" 18m \
            cmake --build --preset ci-kokkos --target "${cpp_targets[@]}"
          build_s=$SECONDS
          SECONDS=0
          # GTest exposes CTest names such as BrickCatalog.EntryRoundTrips, which do not
          # necessarily start with their build target. Select through the target label installed
          # by pops_add_gtest_suite so every discovered case of every built target runs exactly once.
          # Inventory CTest once and fail target-by-target before execution: a missing/malformed
          # target label must never turn this shard into a false-green "No tests were found" run.
          ctest_inventory="$RUNNER_TEMP/ctest-shard-${{ matrix.shard }}.json"
          standalone_regex_file="$RUNNER_TEMP/ctest-standalone-shard-${{ matrix.shard }}.regex"
          ctest --preset ci-kokkos -N --show-only=json-v1 > "$ctest_inventory"
          python3 scripts/ci_select_tests.py verify-cpp-target-labels \
            --ctest-json "$ctest_inventory" \
            --targets "${cpp_targets[@]}" \
            --standalone-regex-file "$standalone_regex_file"
          test_watchdog=7m
          run_with_heartbeat "Kokkos Serial shard ${{ matrix.shard }} tests" "$test_watchdog" \
            ctest --preset ci-kokkos -L '${{ steps.test-plan.outputs.cpp_shard_label_regex }}'
          test_s=$SECONDS
          {
            echo "### gate-cpp (Kokkos Serial, C++)"
            echo ""
            echo "| Phase | Duree (s) |"
            echo "| --- | --- |"
            echo "| configure + build | ${build_s} |"
            echo "| tests (ctest) | ${test_s} |"
            echo "| selection | ${{ steps.test-plan.outputs.cpp_summary }} |"
            echo "| shard | ${{ steps.test-plan.outputs.cpp_shard_summary }} |"
            echo ""
            echo "Hit-rate ccache :"
            echo '```'
            ccache -s | grep -i hits || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ccache stats (Kokkos Serial, shard ${{ matrix.shard }})
        if: ${{ always() && steps.kokkos.outcome == 'success' }}
        run: ccache -s

      - name: Standalone CTest contracts
        if: matrix.shard == 0 && needs.set-mode.outputs.full == 'true'
        run: |
          standalone_regex_file="$RUNNER_TEMP/ctest-standalone-shard-${{ matrix.shard }}.regex"
          test -s "$standalone_regex_file"
          standalone_regex=$(<"$standalone_regex_file")
          test -n "$standalone_regex" && test "$standalone_regex" != '$^'
          ctest --preset ci-kokkos --output-on-failure \
            --no-tests=error \
            -R "$standalone_regex"

      - name: Save ccache (Kokkos Serial, shard ${{ matrix.shard }})
        if: ${{ always() && steps.kokkos.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CCACHE_CACHE_KEY }}

  # Check historique stable pour la branch protection et l'agregateur global. Le resultat d'un
  # job matrix est agrege par GitHub : un seul shard en echec/timeout/annulation fait echouer ce
  # verdict ; un matrix skippe par le routage reste un succes explicite.
  gate-cpp:
    name: ubuntu-latest / Kokkos Serial (C++)
    runs-on: ubuntu-latest
    needs: [changes, set-mode, gate-cpp-shards]
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Verdict C++ shards
        run: |
          python3 scripts/ci_route_mode.py check \
            --gate changes "${{ needs.changes.result }}" true \
            --gate set-mode "${{ needs.set-mode.result }}" true \
            --gate gate-cpp-shards "${{ needs.gate-cpp-shards.result }}" \
              "${{ needs.set-mode.outputs.cpp_required }}"

  # GATE PYTHON ARCHITECTURE : tests source-only (pas de _pops, pas de Kokkos). Ils couvrent les
  # invariants de structure du package Python et doivent rester legers meme quand seule l'architecture
  # de tests change.
  # ADC-548 (a)(c): the plan selects source-only architecture consumers. Full plans include
  # every architecture test; the selected list is required to be nonempty before pytest starts.
  gate-python-architecture:
    name: ubuntu-latest / Python architecture
    runs-on: ubuntu-latest
    needs: [changes, set-mode]
    if: needs.set-mode.outputs.architecture_required == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download shared execution plan
        uses: actions/download-artifact@v8
        with:
          name: ci-plan
          path: ci-plan

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Spec 4 architecture tests
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          # numpy: a hard dependency of the package that pyright must RESOLVE now that the
          # ADC-628 include list covers all of python/pops (the tests themselves stay source-only).
          pip install --upgrade pip pytest pyright numpy
          mapfile -t architecture_tests < ci-plan/architecture-tests.txt
          test "${#architecture_tests[@]}" -gt 0
          python3 -m pytest -q "${architecture_tests[@]}"

      - name: M2 temporal gate manifest
        run: python3 scripts/run_m2_gate.py --check-only

      - name: M3 AMR and multi-layout gate manifest
        run: python3 scripts/run_m3_gate.py --check-only

      - name: M4 native runtime and scientific I/O gate manifest
        run: python3 scripts/run_m4_gate.py --check-only

      - name: Generated component catalog
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: python3 scripts/generate_component_catalog.py --check

      - name: Pyright
        run: pyright

  # PREWARM PYTHON NATIF : trois runners compilent des ensembles d'objets O3 disjoints du MEME
  # graphe Ninja (System/core, runtime AMR exact, solveurs de champ AMR). Ils ne publient aucun
  # binaire : seulement
  # les entrees ccache adressees par contenu et un contrat compilateur/flags/SHA/sources. Le build
  # final ci-dessous reconfigure officiellement tout le module, authentifie les trois contrats,
  # consomme les hits puis effectue lui-meme le link. Un cache module exact evite meme ce prewarm.
  gate-python-prewarm:
    name: ubuntu-latest / Kokkos Serial (Python prewarm Dim${{ matrix.dimension }} ${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, set-mode]
    if: needs.set-mode.outputs.python_required == 'true' || needs.set-mode.outputs.compile_cache_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        dimension: ${{ fromJSON(needs.set-mode.outputs.python_dimensions) }}
        lane: [system, amr-runtime, amr-fields]

    env:
      # This source-matrix lane builds one explicit native specialization.  Runtime plans remain
      # dimension-derived; the low-level CI build selector must never be inferred from artifacts.
      POPS_NATIVE_DIM: ${{ matrix.dimension }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache-py
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: locale
      KOKKOS_PREFIX: ${{ github.workspace }}/.kokkos-install

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: kokkos
        uses: ./.github/actions/setup-kokkos
        with:
          # Match every consumer before the compiler include-tree capture.
          extra-apt: mold libopenmpi-dev openmpi-bin

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Lookup only: an exact authenticated module makes object prewarming unnecessary. The final
      # job restores the same cache entry and still owns source sync plus all validation.
      - name: Probe exact Python module cache
        id: module-cache-probe
        uses: actions/cache/restore@v6
        with:
          path: build-kokkos-py/python/pops
          lookup-only: true
          key: pops-module-dim${{ matrix.dimension }}-${{ runner.os }}-${{ steps.kokkos.outputs.cache-platform }}-headers${{ steps.kokkos.outputs.compiler-includes }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('include/**', 'src/**', 'python/bindings/**', 'python/CMakeLists.txt', 'CMakeLists.txt', 'cmake/**', 'CMakePresets.json', 'pyproject.toml', '.github/workflows/ci.yml', '.github/actions/setup-kokkos/**', 'scripts/ci_python_module_objects.py', 'scripts/ci_compiler_include_identity.py', 'scripts/write_compiler_include_contract.py', 'python/pops/codegen/_compiler_include_tree.py') }}-kokkos4.4.01-15dc143e

      - name: Configure identical production module graph
        if: steps.module-cache-probe.outputs.cache-hit != 'true'
        run: |
          pip install --upgrade pip numpy pytest
          cmake --preset ci-kokkos-python -DCMAKE_LINKER_TYPE=MOLD \
            -DPOPS_NATIVE_DIM="$POPS_NATIVE_DIM" \
            -DPOPS_HEAVY_MODULE_TU_POOL=4 \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=${{ github.workspace }}=."
          python3 scripts/ci_python_module_objects.py \
            --build-dir build-kokkos-py --verify

      - name: Prewarm production objects (${{ matrix.lane }})
        if: steps.module-cache-probe.outputs.cache-hit != 'true'
        run: |
          SECONDS=0
          source scripts/ci_heartbeat.sh
          export NINJA_STATUS='[%f/%t elapsed=%es active=%r] '
          ccache --zero-stats
          mapfile -t object_targets < <(
            python3 scripts/ci_python_module_objects.py \
              --build-dir build-kokkos-py \
              --lane "${{ matrix.lane }}" \
              --contract-file "$RUNNER_TEMP/python-prewarm-contract-${{ matrix.lane }}.json"
          )
          test "${#object_targets[@]}" -gt 0
          # Four simultaneous GCC frontends now also exhaust the 16 GiB runner on the grown System
          # seam. Bound that lane to two frontends and give its cold O3 path the same measured
          # watchdog margin as OpenMP; the three semantic lanes still execute independently.
          lane_parallelism=4
          lane_watchdog=18m
          case "${{ matrix.lane }}" in
            system)
              lane_parallelism=2
              lane_watchdog=24m
              ;;
            amr-runtime|amr-fields) lane_parallelism=2 ;;
          esac
          run_with_heartbeat "Python prewarm ${{ matrix.lane }}" "$lane_watchdog" \
            cmake --build --preset ci-kokkos-python --parallel "$lane_parallelism" \
              --target "${object_targets[@]}"
          ccache -s
          # ccache already compresses its payload. A tar keeps the content-addressed directory and
          # lets the final job merge lane stores deterministically without publishing object files.
          tar -C "$CCACHE_DIR" -cf "$RUNNER_TEMP/python-prewarm-ccache-${{ matrix.lane }}.tar" .

      - name: Upload prewarm cache and compile contract
        if: steps.module-cache-probe.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gate-python-prewarm-dim${{ matrix.dimension }}-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/python-prewarm-ccache-${{ matrix.lane }}.tar
            ${{ runner.temp }}/python-prewarm-contract-${{ matrix.lane }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # GATE PYTHON BUILD : construit une fois chaque dimension native partagee par les shards.
  # Les tests DSL compilent encore leurs loaders/.so a runtime dans chaque shard, mais le gros build
  # pybind11 n'est plus multiplie par le nombre de shards.
  gate-python-build:
    name: ubuntu-latest / Kokkos Serial (Python build Dim${{ matrix.dimension }})
    runs-on: ubuntu-latest
    # A changed production header invalidates most -O3 runtime objects.  Bound a
    # genuinely cold build rather than relying on partial ccache state from an
    # earlier failed attempt; the exact-module cache still makes warm PRs fast.
    timeout-minutes: 45
    needs: [changes, set-mode, gate-python-prewarm]
    # Build only native dimensions required by selected Python shards or the compile-cache proof.
    # Explicit full overrides select the complete native-dimension inventory.
    if: needs.set-mode.outputs.python_required == 'true' || needs.set-mode.outputs.compile_cache_required == 'true'

    strategy:
      fail-fast: false
      matrix:
        dimension: ${{ fromJSON(needs.set-mode.outputs.python_dimensions) }}

    env:
      POPS_NATIVE_DIM: ${{ matrix.dimension }}
      # ccache dedie au module Python (.ccache-py) : meme separation que l'ancien job build-and-test.
      CCACHE_DIR: ${{ github.workspace }}/.ccache-py
      CCACHE_MAXSIZE: 2G
      KOKKOS_PREFIX: ${{ github.workspace }}/.kokkos-install
      # ADC-366 ccache cross-run/cross-checkout hit-rate: rewrite workspace-absolute paths to relative
      # (BASEDIR + NOHASHDIR) and lift the few residual false misses (SLOPPINESS). Codegen-neutral; the
      # cache KEYS are unchanged. Paired with -ffile-prefix-map on the cmake configure line below.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: locale
      # Unique per attempt so a bounded build can persist every valid object it produced, even when
      # a later step fails. Restore prefixes deliberately remain compatible with PR/master history.
      CCACHE_CACHE_KEY: python-build-dim${{ matrix.dimension }}-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Meme action composite que gate-cpp : apt deps + mold + Kokkos Serial PIC en cache (cle
      # partagee uniquement sur la meme image/architecture/version GCC -> aucune reuse ABI invalide).
      - id: kokkos
        uses: ./.github/actions/setup-kokkos
        with:
          # Match every consumer before the compiler include-tree capture.
          extra-apt: mold libopenmpi-dev openmpi-bin

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Separate restore/save mirrors the C++ shards: an immutable, attempt-qualified key lets the
      # `always()` save retain valid objects from a failed build instead of throwing the work away.
      - name: Restore ccache (Python module)
        id: python-ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CCACHE_CACHE_KEY }}
          restore-keys: |
            ccache-${{ runner.os }}-python-build-dim${{ matrix.dimension }}-${{ github.ref }}-
            ccache-${{ runner.os }}-python-build-dim${{ matrix.dimension }}-refs/heads/master-
            ccache-${{ runner.os }}-python-${{ github.ref }}-
            ccache-${{ runner.os }}-python-refs/heads/master-
            ccache-${{ runner.os }}-python-

      - name: Reset ccache stats (Python module)
        run: ccache --zero-stats

      # ADC-621 EVICTION GUARD for the pure-python fast path. The expensive artifact is the
      # compiled, manifest-authenticated dimension leaf; on a PR that touches NO native-affecting
      # input we want to reuse it instead of recompiling. The key hashes EVERY input that can change
      # the .so, so a stale binary can never be served:
      #   * include/** + src/** + python/bindings/** -- native runtime and pybind adapter sources;
      #   * python/CMakeLists.txt + CMakeLists.txt + cmake/** + CMakePresets.json -- the build graph,
      #     compile flags and POPS_CXX_STD (the presets are the single source of the std/flags);
      #   * the Kokkos version + commit -- the .so links this exact Kokkos runtime (a bump must miss);
      #   * the exact runner image, architecture and gcc version -- the pybind ABI is toolchain-bound.
      # NO restore-keys: exact match only. A near-miss must rebuild, never reuse a stale .so. The
      # pure-Python/type source copies (build-kokkos-py/python/pops/**/*.{py,pyi} + py.typed) are NOT
      # keyed here -- they are re-synced from the PR checkout after a hit (next step), so the cache
      # serves only the binary.
      - name: Cache authenticated Dim=${{ matrix.dimension }} native package
        id: modcache
        uses: actions/cache@v6
        with:
          path: build-kokkos-py/python/pops
          key: pops-module-dim${{ matrix.dimension }}-${{ runner.os }}-${{ steps.kokkos.outputs.cache-platform }}-headers${{ steps.kokkos.outputs.compiler-includes }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('include/**', 'src/**', 'python/bindings/**', 'python/CMakeLists.txt', 'CMakeLists.txt', 'cmake/**', 'CMakePresets.json', 'pyproject.toml', '.github/workflows/ci.yml', '.github/actions/setup-kokkos/**', 'scripts/ci_python_module_objects.py', 'scripts/ci_compiler_include_identity.py', 'scripts/write_compiler_include_contract.py', 'python/pops/codegen/_compiler_include_tree.py') }}-kokkos4.4.01-15dc143e

      - name: Download parallel prewarm caches
        if: steps.modcache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: gate-python-prewarm-dim${{ matrix.dimension }}-*
          path: ${{ github.workspace }}/.pops-ci/python-prewarm

      - name: Merge parallel prewarm caches
        if: steps.modcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CCACHE_DIR"
          mapfile -t cache_archives < <(
            find "${{ github.workspace }}/.pops-ci/python-prewarm" \
              -name 'python-prewarm-ccache-*.tar' -type f | sort
          )
          test "${#cache_archives[@]}" -eq 3
          for cache_archive in "${cache_archives[@]}"; do
            tar -C "$CCACHE_DIR" -xf "$cache_archive"
          done
          # Lane archives include their own statistics shards; reset after the deterministic merge
          # so the final report measures only hits/misses of the authoritative complete build.
          ccache --zero-stats

      # Fast path: an EXACT module-cache hit is authoritative on every event. The key includes every
      # native/build input, exact Python version, compiler platform and Kokkos revision. Re-sync the
      # unkeyed pure-Python sources, then skip only the redundant native rebuild.
      - name: Fast path -- reuse cached module, sync python sources
        id: fastpath
        if: steps.modcache.outputs.cache-hit == 'true'
        run: |
          pip install --upgrade pip numpy pytest
          # Overwrite the (unkeyed, possibly stale) copied Python/type sources with THIS checkout.
          # -I (ignore-times) forces a content sync even if an mtime+size collision would fool the
          # default quick check.  The explicit _native exclusion protects both variants.json and
          # its authenticated dimension leaf from --delete; no root extension is accepted as a fallback.
          rsync -aI --delete --include='*/' --include='*.py' --include='*.pyi' \
            --include='py.typed' --exclude='_native/***' --exclude='*' \
            python/pops/ build-kokkos-py/python/pops/
          {
            echo "### gate-python-build (module _pops, Kokkos Serial)"
            echo ""
            echo "FAST PATH: exact native-package cache hit -> retained variants.json + selected dimension leaf,"
            echo "re-synced the pure-python sources, skipped the cmake build."
          } >> "$GITHUB_STEP_SUMMARY"

      # Les bindings de la lib (module `pops` : System + facades) vivent ICI. On construit l'extension
      # _pops AVEC Kokkos (preset ci-kokkos-python, jobs: 4 ; CMAKE_LINKER_TYPE=MOLD en -D ici uniquement).
      # Saute uniquement sur le cache module exact authentifie ci-dessus. Sur un miss, les caches
      # d'objets paralleles sont des accelerateurs : ce build final officiel revoit tout le graphe,
      # obtient des hits ccache, compile tout objet restant puis effectue lui-meme le link.
      - name: Build module Python `pops` (Kokkos Serial)
        if: steps.modcache.outputs.cache-hit != 'true'
        # The inner watchdog covers the measured cold-build floor while leaving
        # bounded room inside the job for configure, reporting, and ccache save.
        timeout-minutes: 42
        run: |
          pip install --upgrade pip numpy pytest
          SECONDS=0
          # -ffile-prefix-map (ADC-366): rewrite the workspace-absolute __FILE__/debug paths the compiler
          # bakes into objects to relative, so ccache hits across checkouts/shards. Codegen-neutral (only
          # embedded path strings change; instructions/symbols identical) -> the abi_key (compiler+header
          # content hash) is untouched. CI-only -D, mirroring -DCMAKE_LINKER_TYPE=MOLD (presets stay clean).
          # POPS_HEAVY_MODULE_TU_POOL=4 (ADC-621): use the public Linux runner's four compile slots.
          # Keeping the old value 2 serialized half of the exact-ranked runtime objects.
          # This measured CI-only override remains guarded by the cold-build watchdog
          # and attempt cache; the CMake default stays the conservative size-1 OOM
          # guard and wheel builders keep their platform-specific bounded pools.
          export NINJA_STATUS='[%f/%t elapsed=%es active=%r] '
          cmake --preset ci-kokkos-python -DCMAKE_LINKER_TYPE=MOLD \
            -DPOPS_NATIVE_DIM="$POPS_NATIVE_DIM" \
            -DPOPS_HEAVY_MODULE_TU_POOL=4 \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=${{ github.workspace }}=."
          mapfile -t compile_contracts < <(
            find "${{ github.workspace }}/.pops-ci/python-prewarm" \
              -name 'python-prewarm-contract-*.json' -type f | sort
          )
          test "${#compile_contracts[@]}" -eq 3
          # Refuse prewarmed entries unless the final official graph proves the same compiler,
          # complete command flags, Git revision and source content for every runtime object.
          python3 scripts/ci_python_module_objects.py \
            --build-dir build-kokkos-py \
            --verify-contracts "${compile_contracts[@]}"
          set +e
          timeout --signal=TERM --kill-after=30s 40m \
            cmake --build --preset ci-kokkos-python
          build_status=$?
          set -e
          build_s=$SECONDS
          {
            echo "### gate-python-build (module _pops, Kokkos Serial)"
            echo ""
            echo "| Phase | Duree (s) |"
            echo "| --- | --- |"
            echo "| configure + build | ${build_s} |"
            echo ""
            echo "Hit-rate ccache :"
            echo '```'
            ccache -s | grep -i hits || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ $build_status -eq 124 ]]; then
            echo "::error::Python native build exceeded its 40-minute cold-build watchdog"
          fi
          exit "$build_status"

      - name: ccache stats (Python module)
        if: ${{ always() && steps.kokkos.outcome == 'success' }}
        run: ccache -s

      - name: Save ccache (Python module)
        if: ${{ always() && steps.kokkos.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CCACHE_CACHE_KEY }}

      - name: Authenticate Dim=${{ matrix.dimension }} Python native variant
        env:
          PYTHONPATH: ${{ github.workspace }}/build-kokkos-py/python
          PYTHONNOUSERSITE: "1"
        run: >-
          python3 scripts/verify_installed_native.py
          --expect-dim "$POPS_NATIVE_DIM" --expect-serial

      - name: Assemble authenticated installed-package wheel without recompiling Native
        run: |
          python3 scripts/ci_assemble_installed_wheel.py \
            --package build-kokkos-py/python --dimension "$POPS_NATIVE_DIM" \
            --output-dir "$RUNNER_TEMP/pops-ci-wheel"
      - name: Upload Python module artifact
        uses: actions/upload-artifact@v7
        with:
          name: gate-python-build-kokkos-py-dim${{ matrix.dimension }}
          path: ${{ runner.temp }}/pops-ci-wheel/**
          if-no-files-found: error
          retention-days: 1

      - name: ccache stats (Python module build)
        if: always()
        run: ccache -s

  # GATE PYTHON (ADC-366). La suite tests/python est shardee en N legs, mais consomme l'artefact
  # _pops construit par gate-python-build au lieu de reconstruire le module dans chaque shard.
  gate-python:
    name: ubuntu-latest / Kokkos Serial (Python) shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Shards are independent (`fail-fast: false`) and must all report a result.  Native-loader
    # tests can legitimately run for tens of minutes on a cold public runner. Duration-weighted
    # shards reserve room below the watchdog; the remaining margin covers setup and
    # transient runner variance without turning a stalled test into an unbounded job.
    timeout-minutes: ${{ matrix.shard == 0 && 110 || matrix.shard < 4 && 80 || matrix.shard < 6 && 60 || 50 }}
    needs: [changes, set-mode, gate-python-build]
    if: needs.set-mode.outputs.python_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Keep original duration-bin identities even when the plan omits empty bins.
        # Watchdogs and native-dimension routing continue to use the fixed 135-bin partition.
        shard: ${{ fromJSON(needs.set-mode.outputs.python_matrix) }}

    env:
      PYTHONUNBUFFERED: "1"
      # ccache reste utile aux tests DSL qui compilent des loaders/.so a runtime dans chaque shard.
      CCACHE_DIR: ${{ github.workspace }}/.ccache-py
      CCACHE_MAXSIZE: 2G
      KOKKOS_PREFIX: ${{ github.workspace }}/.kokkos-install
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: locale
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: "135"
      # ADC-548 (b): pin the DSL .so cache to a KNOWN dir and keep the generated source so a codegen
      # failure in a shard's DSL tests leaves the ADC-536 provenance sidecars (<so>.cpp + <so>.cachekey)
      # on disk for the on-failure upload. Setting POPS_CACHE_DIR here just relocates the default cache
      # (~/.cache/pops/dsl) to a workspace path; POPS_KEEP_GENERATED=1 persists the inert (sidecar-only,
      # redacted) banner .cpp -- neither changes the compiled .so bytes nor the cache key.
      POPS_CACHE_DIR: ${{ github.workspace }}/.pops-dsl-cache
      POPS_KEEP_GENERATED: "1"
      # This lane installs the compiled extension, Kokkos and a C++ compiler. Native acceptance
      # files must fail if any prerequisite/import/API disappears; a source-only local run may skip.
      POPS_REQUIRE_NATIVE_TESTS: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download shared execution plan
        uses: actions/download-artifact@v8
        with:
          name: ci-plan
          path: ci-plan

      - name: Select affected Python tests
        id: test-plan
        run: |
          force_args=()
          if [ "${{ needs.set-mode.outputs.full }}" = "true" ]; then
            force_args+=(--force-all)
          fi
          python3 scripts/ci_select_tests.py python \
            --changed-files ci-plan/python-changed-files.txt \
            --explain-file "$RUNNER_TEMP/python-test-plan.json" \
            --tests-file "$RUNNER_TEMP/python-tests.txt" \
            --shard-index "$SHARD_INDEX" \
            --shard-total "$SHARD_TOTAL" \
            --github-output "$GITHUB_OUTPUT" \
            "${force_args[@]}"
          echo "tests_file=$RUNNER_TEMP/python-tests.txt" >> "$GITHUB_OUTPUT"
          python3 scripts/ci_python_dimensions.py \
            --selected-file "$RUNNER_TEMP/python-tests.txt" --github-output "$GITHUB_OUTPUT"
          python3 scripts/ci_pytest_timings.py \
            --selected-file "$RUNNER_TEMP/python-tests.txt" \
            --shard-index "$SHARD_INDEX" --github-output "$GITHUB_OUTPUT"
          python_summary=$(grep '^python_summary=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          python_areas=$(grep '^python_areas=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          {
            echo "### affected Python tests"
            echo ""
            echo "- ${python_summary}"
            echo "- areas: ${python_areas}"
            echo "- plan: artifact \`gate-python-test-plan-shard-${{ matrix.shard }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Python test plan
        uses: actions/upload-artifact@v7
        with:
          name: gate-python-test-plan-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/python-test-plan.json

      # ADC-623 SAFETY: reconstruct EVERY shard from the same selection and fail loudly unless
      # they exactly cover it (minus the dedicated compile-cache file). This catches a broken
      # duration binpacking BEFORE any test runs, so a rebalance can never silently drop or
      # duplicate a test file. Cheap (source-only, no build) and runs in every shard job.
      - name: Verify shard partition is exact
        run: |
          force_args=()
          if [ "${{ needs.set-mode.outputs.full }}" = "true" ]; then
            force_args+=(--force-all)
          fi
          python3 scripts/ci_select_tests.py verify \
            --changed-files ci-plan/python-changed-files.txt \
            --shard-total "$SHARD_TOTAL" \
            "${force_args[@]}"

      - id: kokkos
        if: steps.test-plan.outputs.python_shard_count != '0'
        uses: ./.github/actions/setup-kokkos
        with:
          # Required syntax witnesses instantiate the genuine MPI branch even on the Serial lane.
          extra-apt: mold libopenmpi-dev openmpi-bin

      - uses: actions/setup-python@v7
        if: steps.test-plan.outputs.python_shard_count != '0'
        with:
          python-version: '3.12'
          cache: pip

      - name: Download Dim1 Python module artifact
        if: steps.test-plan.outputs.dim1_count != '0'
        uses: actions/download-artifact@v8
        with:
          name: gate-python-build-kokkos-py-dim1
          path: .pops-ci/python-packages/dim1

      - name: Download Dim2 Python module artifact
        if: steps.test-plan.outputs.dim2_count != '0'
        uses: actions/download-artifact@v8
        with:
          name: gate-python-build-kokkos-py-dim2
          path: .pops-ci/python-packages/dim2

      - name: Download Dim3 Python module artifact
        if: steps.test-plan.outputs.dim3_count != '0'
        uses: actions/download-artifact@v8
        with:
          name: gate-python-build-kokkos-py-dim3
          path: .pops-ci/python-packages/dim3

      - name: Cache ccache (Python runtime loaders)
        if: steps.test-plan.outputs.python_shard_count != '0'
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-python-runtime-shard${{ matrix.shard }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-python-runtime-shard${{ matrix.shard }}-${{ github.ref }}-
            ccache-${{ runner.os }}-python-runtime-shard${{ matrix.shard }}-refs/heads/master-
            ccache-${{ runner.os }}-python-build-${{ github.ref }}-
            ccache-${{ runner.os }}-python-build-refs/heads/master-
            ccache-${{ runner.os }}-python-

      - name: Test module Python `pops` shard ${{ matrix.shard }} (Kokkos Serial)
        if: steps.test-plan.outputs.python_shard_count != '0'
        timeout-minutes: ${{ fromJSON(steps.test-plan.outputs.test_timeout_minutes) }}
        run: |
          # The full gate exercises the serial HDF5 writer used by the final examples. h5py remains
          # an optional user dependency; CI installs that capability explicitly instead of skipping.
          # mpmath supplies the independent precision oracle in the Fan–Li native witnesses.
          # scipy supplies the independent matrix-exponential and DOP853 reference oracles.
          pip install --upgrade pip numpy pytest h5py scipy 'mpmath>=1.3.0'
          # PoPS est Kokkos-only : les tests DSL qui compilent un loader/.so production ou son ABI
          # incluent les en-tetes pops (-> for_each, #error sans Kokkos). Ils lisent le Kokkos a utiliser
          # via Kokkos_ROOT / POPS_KOKKOS_ROOT : on pointe le MEME Kokkos Serial que le module _pops.
          export Kokkos_ROOT="${KOKKOS_PREFIX}" POPS_KOKKOS_ROOT="${KOKKOS_PREFIX}"
          # ADC-548 (b): ensure the pinned DSL cache dir exists so any codegen sidecars land in a known
          # place for the on-failure upload (empty when this shard runs no DSL-compiling test).
          mkdir -p "$POPS_CACHE_DIR"
          SECONDS=0
          # ADC-366 sharded runner. The selected file list is produced by scripts/ci_select_tests.py,
          # then one pytest process per declared dimension owns collection and reporting.
          : "${SHARD_INDEX:=0}" "${SHARD_TOTAL:=1}"
          timings="$RUNNER_TEMP/pytimings"; mkdir -p "$timings"
          selected="${{ steps.test-plan.outputs.tests_file }}"
          if [ ! -s "$selected" ]; then
            echo "No affected Python tests selected for shard ${SHARD_INDEX}/${SHARD_TOTAL}."
            exit 0
          fi
          mapfile -t selected_tests < "$selected"
          printf '%s\n' "${selected_tests[@]}" > "$timings/selected.txt"
          set +e
          python3 scripts/ci_python_dimensions.py --selected-file "$selected" \
            --packages-root "$PWD/.pops-ci/python-packages" --timings-dir "$timings"
          rc=$?
          set -e
          test_s=$SECONDS
          printf '{"shard":%s,"total":%s,"seconds":%s,"files":%s}\n' \
            "$SHARD_INDEX" "$SHARD_TOTAL" "$test_s" "$(wc -l < "$selected")" > "$timings/shard-summary.json"
          {
            echo "### gate-python shard ${SHARD_INDEX}/${SHARD_TOTAL} (module _pops, Kokkos Serial)"
            echo ""
            echo "| Phase | Duree (s) |"
            echo "| --- | --- |"
            echo "| tests (python, this shard) | ${test_s} |"
            echo "| selection | ${{ steps.test-plan.outputs.python_summary }} |"
            echo ""
            echo "Selected test files (first 25):"
            echo '```'
            head -25 "$timings/selected.txt"
            echo '```'
            echo "Hit-rate ccache :"
            echo '```'
            ccache -s | grep -i hits || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload per-file test timings (ADC-366)
        if: always() && steps.test-plan.outputs.python_shard_count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: gate-python-timings-shard${{ matrix.shard }}
          path: ${{ runner.temp }}/pytimings/
          if-no-files-found: ignore

      # ADC-548 (b): on a shard failure, ship any ADC-536 provenance sidecars a DSL-compiling test
      # left in POPS_CACHE_DIR (the generated .cpp banner + the .cachekey). Most shards run no codegen
      # test, so if-no-files-found: ignore keeps a non-codegen failure from turning red on an empty
      # upload. The banner is redacted and sidecar-only -- it cannot leak a secret nor alter the .so.
      - name: Upload codegen debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: codegen-debug-shard${{ matrix.shard }}
          path: |
            ${{ env.POPS_CACHE_DIR }}/**/*.cpp
            ${{ env.POPS_CACHE_DIR }}/**/*.cachekey
            ${{ env.POPS_CACHE_DIR }}/**/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: ccache stats (Python module)
        if: always() && steps.test-plan.outputs.python_shard_count != '0'
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache -s
          else
            echo "ccache was not installed because this job stopped before dependency setup"
          fi

  # GATE PYTHON COMPILE-CACHE (ADC-623). The final-lifecycle cache proof performs four deliberate
  # cold native package compilations plus exact semantic hits/misses (POPS_PROCESS_TIMEOUT = 900).
  # shard's critical path plus its per-file process-isolation overhead. Isolated here into a
  # DEDICATED job so it no longer weighs on the sharded suite (scripts/ci_shard_binpack.py
  # excludes it from the shard partition; the exactness check accounts for the exclusion).
  # The final DSL cache proof deliberately owns an isolated temporary native cache: it must prove
  # one real cold compile, an exact semantic hit and a semantic miss on every run. Persisting that
  # cache would make the miss assertion depend on previous CI history; ccache remains persisted and
  # accelerates the underlying compiler work without changing the artifact-cache semantics.
  # ADC-548 (a): this dedicated job is the CODEGEN + MANIFEST + CACHE-ABI proof AND the
  # generated-program compile/bind SMOKE -- its native compiles emit -> .so -> load,
  # exercising the write/verify of the <so>.cachekey sidecar and the backend/ABI cache key. On a
  # codegen failure it uploads the ADC-536 provenance sidecars (see the trailing failure step).
  gate-python-compile-cache:
    name: ubuntu-latest / Kokkos Serial (Python) compile-cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, set-mode, gate-python-build]
    if: needs.set-mode.outputs.compile_cache_required == 'true'

    env:
      POPS_NATIVE_DIM: "2"
      CCACHE_DIR: ${{ github.workspace }}/.ccache-py
      CCACHE_MAXSIZE: 2G
      KOKKOS_PREFIX: ${{ github.workspace }}/.kokkos-install
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: locale
      COMPILE_CACHE_TEST: tests/python/integration/mpi/test_dsl_compile_cache.py
      # This job owns the final native compile/cache acceptance.  A missing compiler, Kokkos
      # install, compiled extension, or native API is a release failure here, never a green skip.
      POPS_REQUIRE_NATIVE_TESTS: "1"
      # `runner.temp` is likewise a step-only context. A workspace-local, ignored test temporary is
      # deterministic and remains available to the failure-artifact upload steps.
      COMPILE_CACHE_TMP: ${{ github.workspace }}/.pops-ci/compile-cache-test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: kokkos
        uses: ./.github/actions/setup-kokkos
        with:
          # Match every consumer before the compiler include-tree capture.
          extra-apt: mold libopenmpi-dev openmpi-bin

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Download Python module artifact
        uses: actions/download-artifact@v8
        with:
          name: gate-python-build-kokkos-py-dim2
          path: .pops-ci/python-packages/dim2

      - name: Cache ccache (Python runtime loaders)
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-python-compile-cache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-python-compile-cache-${{ github.ref }}-
            ccache-${{ runner.os }}-python-compile-cache-refs/heads/master-
            ccache-${{ runner.os }}-python-build-${{ github.ref }}-
            ccache-${{ runner.os }}-python-build-refs/heads/master-
            ccache-${{ runner.os }}-python-

      - name: Test DSL compile-cache (Kokkos Serial)
        # ADC-548 (b): POPS_KEEP_GENERATED=1 persists the ADC-536 provenance sidecar -- the generated
        # <so>.cpp (banner = serialized IR + hashes + flags + toolchain + REDACTED compile command) --
        # next to each .so in the test-owned isolated cache, alongside the <so>.cachekey.
        # The banner is inert (sidecar-only), so the .so bytes and the cache key are unchanged whether
        # this is set or not; on a codegen failure the trailing step uploads the sidecars for debug.
        env:
          POPS_KEEP_GENERATED: "1"
        run: |
          pip install --upgrade pip numpy pytest
          export Kokkos_ROOT="${KOKKOS_PREFIX}" POPS_KOKKOS_ROOT="${KOKKOS_PREFIX}"
          mkdir -p "$COMPILE_CACHE_TMP"
          printf '%s\n' "$COMPILE_CACHE_TEST" > "$COMPILE_CACHE_TMP/selected.txt"
          SECONDS=0
          set +e
          # The compile-cache witness consumes the same installed wheel as Python shards.
          # Its retained proof and private environment are authenticated before pytest starts.
          python3 scripts/ci_python_dimensions.py \
            --selected-file "$COMPILE_CACHE_TMP/selected.txt" \
            --packages-root "$PWD/.pops-ci/python-packages" \
            --timings-dir "$COMPILE_CACHE_TMP/receipts" \
            --install-root "$RUNNER_TEMP/pops-installed-compile-cache"
          rc=$?
          set -e
          test_s=$SECONDS
          {
            echo "### gate-python-compile-cache: codegen + manifest + cache-ABI + generated-program compile/bind SMOKE (Kokkos Serial)"
            echo ""
            echo "| Phase | Duree (s) |"
            echo "| --- | --- |"
            echo "| tests (compile-cache) | ${test_s} |"
            echo ""
            echo "Hit-rate ccache :"
            echo '```'
            ccache -s | grep -i hits || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # ADC-548 (b): on a codegen failure, ship the ADC-536 provenance sidecars for offline debug --
      # the generated .cpp (self-describing banner) and the .cachekey the compile persisted into
      # isolated pytest temp root. The banner uses the REDACTED compile command and lives only in the sidecar, so
      # this cannot leak a secret. if-no-files-found: ignore keeps a non-codegen failure from going red.
      - name: Upload codegen debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: codegen-debug-compile-cache
          path: |
            ${{ env.COMPILE_CACHE_TMP }}/**/*.cpp
            ${{ env.COMPILE_CACHE_TMP }}/**/*.cachekey
            ${{ env.COMPILE_CACHE_TMP }}/**/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: ccache stats (Python compile-cache)
        if: always()
        run: ccache -s

  # PREWARM MPI NATIF. Le prewarm Serial ci-dessus ne peut pas produire de hits ccache fiables pour
  # une compilation MPI/HDF5 : les definitions, include paths et commandes C++ different. Ces trois
  # lanes configurent donc le graphe ci-mpi exact et compilent uniquement sa partition disjointe
  # d'objets runtime. Comme pour le prewarm Serial, les artefacts ne contiennent aucun binaire lie :
  # seulement les entrees ccache et un contrat compiler/flags/revision/sources que le job final verifie.
  gate-mpi-prewarm:
    name: ubuntu-24.04 / MPI + Kokkos Serial (C++ prewarm ${{ matrix.lane }})
    runs-on: ubuntu-24.04
    # setup-kokkos can consume ~15 minutes on a cold runner. Keep enough room
    # for the System lane's explicit 24-minute compile watchdog and artifact publication.
    timeout-minutes: 50
    needs: [set-mode, changes]
    if: needs.set-mode.outputs.mpi_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        lane: [system, amr-runtime, amr-fields]

    env:
      POPS_NATIVE_DIM: "2"
      CCACHE_DIR: ${{ github.workspace }}/.ccache-mpi-prewarm
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: locale
      KOKKOS_PREFIX: ${{ github.workspace }}/.kokkos-install

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-kokkos
        with:
          extra-apt: libhdf5-openmpi-dev libopenmpi-dev openmpi-bin pybind11-dev python3-dev

      - name: Restore reusable MPI ccache (${{ matrix.lane }})
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-mpi-prewarm-${{ matrix.lane }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-mpi-${{ github.ref }}-
            ccache-${{ runner.os }}-mpi-refs/heads/master-
            ccache-${{ runner.os }}-mpi-

      - name: Prewarm MPI production runtime objects (${{ matrix.lane }})
        run: |
          source scripts/ci_heartbeat.sh
          lane_parallelism=4
          lane_watchdog=18m
          case "${{ matrix.lane }}" in
            system)
              lane_parallelism=2
              lane_watchdog=24m
              ;;
            amr-runtime|amr-fields) lane_parallelism=2 ;;
          esac
          mpi_cmake_args=()
          if mpiexec --version 2>&1 | grep -Eqi 'Open MPI|OpenRTE'; then
            mpi_cmake_args+=("-DMPIEXEC_PREFLAGS=--mca;orte_abort_on_non_zero_status;1")
          fi
          export NINJA_STATUS='[%f/%t elapsed=%es active=%r] '
          cmake --preset ci-mpi \
            -DPOPS_NATIVE_DIM="$POPS_NATIVE_DIM" \
            -DPOPS_BUILD_PYTHON=ON \
            -DPOPS_USE_HDF5=ON \
            -DPOPS_HEAVY_TEST_TU_POOL="$lane_parallelism" \
            -DPython_EXECUTABLE=/usr/bin/python3 \
            "${mpi_cmake_args[@]}"
          python3 scripts/ci_python_module_objects.py --build-dir build-mpi --verify
          ccache --zero-stats
          mapfile -t object_targets < <(
            python3 scripts/ci_python_module_objects.py \
              --build-dir build-mpi \
              --lane "${{ matrix.lane }}" \
              --contract-file "$RUNNER_TEMP/mpi-prewarm-contract-${{ matrix.lane }}.json"
          )
          test "${#object_targets[@]}" -gt 0
          run_with_heartbeat "MPI prewarm ${{ matrix.lane }}" "$lane_watchdog" \
            cmake --build --preset ci-mpi --parallel "$lane_parallelism" \
              --target "${object_targets[@]}"
          ccache -s
          tar -C "$CCACHE_DIR" -cf "$RUNNER_TEMP/mpi-prewarm-ccache-${{ matrix.lane }}.tar" .

      - name: Upload MPI prewarm cache and compile contract
        uses: actions/upload-artifact@v7
        with:
          name: gate-mpi-prewarm-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/mpi-prewarm-ccache-${{ matrix.lane }}.tar
            ${{ runner.temp }}/mpi-prewarm-contract-${{ matrix.lane }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Agregation REQUISE : l'UNIQUE check a referencer dans la branch protection (ADC-166). Resout
  # trois faiblesses structurelles du routage par chemins (findings revue ADC-171) :
  #  (1) GitHub traite un required check SKIPPED comme PASSANT -> sans agregateur, une PR touchant
  #      uniquement des fichiers hors filtres mergerait au vert sans jamais construire ;
  #  (2) si le job `changes` echoue (collecte du diff), les gates sont skip en silence ->
  #      ici gate ECHOUE explicitement (routage non fiable = pas de verdict) ;
  #  (3) le nom du check reste STABLE meme si les gates sont re-decoupes plus tard.
  # Un gate skip PAR LE ROUTAGE (changes en succes) reste un succes : c'est le but du routage.
  mpi-dim1:
    name: ubuntu-24.04 / MPI Dim1 Python collective rejection
    runs-on: ubuntu-24.04
    # One authenticated MPI Dim1 module and its mandatory two-rank regression.
    # 15 min cold dependencies + 40 min module build + 8 min installation/authentication
    # + 15 min MPI test ceiling + 2 min bounded publication/cleanup.
    timeout-minutes: 80
    needs: [set-mode, changes]
    if: needs.set-mode.outputs.mpi_required == 'true'
    env:
      POPS_NATIVE_DIM: "1"
      POPS_REQUIRE_NATIVE_TESTS: "1"
      POPS_REQUIRE_MPI_TESTS: "1"
      PYTHONNOUSERSITE: "1"
      KOKKOS_PREFIX: ${{ github.workspace }}/.kokkos-install
      CCACHE_DIR: ${{ github.workspace }}/.ccache-mpi-dim1
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: locale
      OMP_NUM_THREADS: "2"
      OMP_PROC_BIND: "false"
      OMPI_MCA_rmaps_base_oversubscribe: "true"
      PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
      OMPI_MCA_io: "^ompio"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-kokkos
        id: kokkos
        with:
          extra-apt: libhdf5-openmpi-dev libopenmpi-dev openmpi-bin pybind11-dev python3-dev python3-venv python3-pip python3-packaging python3-numpy python3-pytest python3-h5py python3-mpmath
      - name: Restore MPI Dim1 module ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ steps.kokkos.outputs.cache-platform }}-mpi-dim1-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.kokkos.outputs.cache-platform }}-mpi-dim1-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ steps.kokkos.outputs.cache-platform }}-mpi-dim1-refs/heads/master-
      - name: Plan exact Dim1 MPI entrypoints
        id: mpi-dim1-plan
        run: |
          /usr/bin/python3 scripts/ci_select_tests.py python-mpi \
            --native-dimension 1 \
            --plan-file build-mpi-dim1/python-mpi-plan.tsv \
            --orchestrator-plan-file build-mpi-dim1/python-mpi-orchestrators.txt \
            --explain-file build-mpi-dim1/python-mpi-plan.json \
            --github-output "$GITHUB_OUTPUT"
          test "$(wc -l < build-mpi-dim1/python-mpi-plan.tsv)" -eq 1
          test ! -s build-mpi-dim1/python-mpi-orchestrators.txt
      - name: Configure MPI Dim1 Python module without C++ suites
        run: |
          cmake --preset ci-mpi -B build-mpi-dim1 \
            -DPOPS_NATIVE_DIM=1 -DPOPS_BUILD_TESTS=OFF -DPOPS_BUILD_PYTHON=ON \
            -DPOPS_USE_MPI=ON -DPOPS_USE_HDF5=ON \
            -DPython_EXECUTABLE=/usr/bin/python3 \
            -DPOPS_HEAVY_MODULE_TU_POOL=2 -DPOPS_LIGHT_MODULE_TU_POOL=2 \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=${{ github.workspace }}=."
      - name: Build authenticated MPI Dim1 native module
        timeout-minutes: 42
        run: |
          source scripts/ci_heartbeat.sh
          run_with_heartbeat "MPI Dim1 native Python build" 40m \
            cmake --build build-mpi-dim1 --parallel 2 --target _pops
      - name: Assemble and authenticate installed MPI Dim1 wheel
        timeout-minutes: 8
        run: |
          wheel_directory="$RUNNER_TEMP/pops-mpi-dim1-wheel"
          /usr/bin/python3 scripts/ci_assemble_installed_wheel.py \
            --package build-mpi-dim1/python --output-dir "$wheel_directory" \
            --dimension 1 --backend mpi
          native_prefix="$RUNNER_TEMP/pops-mpi-dim1-installed"
          test ! -e "$native_prefix"
          /usr/bin/python3 -m venv --system-site-packages "$native_prefix"
          wheels=("$wheel_directory"/pops-*.whl)
          test "${#wheels[@]}" -eq 1
          env -u PYTHONPATH "$native_prefix/bin/python" -m pip --isolated install \
            --ignore-installed --no-deps --prefix "$native_prefix" "${wheels[0]}"
          env -u PYTHONPATH "$native_prefix/bin/python" scripts/prove_installed_wheel.py \
            --wheel "${wheels[0]}" --expect-dim 1 \
            > build-mpi-dim1/installed-wheel-proof.json
          env -u PYTHONPATH "$native_prefix/bin/python" scripts/verify_installed_native.py \
            --expect-dim 1 --expect-mpi --expect-parallel-hdf5 --json \
            > build-mpi-dim1/installed-native-proof.json
      - name: Test mandatory MPI Dim1 collective rejection
        timeout-minutes: 15
        env:
          POPS_KOKKOS_ROOT: ${{ github.workspace }}/.kokkos-install
          Kokkos_ROOT: ${{ github.workspace }}/.kokkos-install
        run: |
          native_python="$RUNNER_TEMP/pops-mpi-dim1-installed/bin/python"
          native_bootstrap="from pops._native_selector import select_native_dimension; select_native_dimension(1); import os, runpy, sys; sys.path.insert(0, os.getcwd()); sys.argv=sys.argv[1:]; runpy.run_path(sys.argv[0], run_name='__main__')"
          count=0
          while IFS=$'\t' read -r ranks entrypoint <&3; do
            test "$ranks" -eq 2 && test -f "$entrypoint"
            env -u PYTHONPATH timeout --signal=TERM --kill-after=30s 14m \
              mpiexec --mca orte_abort_on_non_zero_status 1 -n "$ranks" \
              "$native_python" -u -c "$native_bootstrap" "$entrypoint" </dev/null 3<&-
            count=$((count + 1))
          done 3< build-mpi-dim1/python-mpi-plan.tsv
          test "$count" -eq "${{ steps.mpi-dim1-plan.outputs.python_mpi_entrypoint_count }}"
          test "$count" -eq 1
      - name: Save MPI Dim1 module ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ steps.kokkos.outputs.cache-platform }}-mpi-dim1-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload MPI Dim1 identity and routing receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpi-dim1-installed-contract
          path: |
            build-mpi-dim1/python-mpi-plan.json
            build-mpi-dim1/installed-wheel-proof.json
            build-mpi-dim1/installed-native-proof.json
            ${{ runner.temp }}/pops-mpi-dim1-wheel/assembly-receipt.json
          if-no-files-found: error
          retention-days: 1

  gate:
    name: gate (agregation requise)
    runs-on: ubuntu-latest
    needs: [changes, set-mode, gate-cpp, gate-python-architecture, gate-python-build, gate-python, gate-python-compile-cache, mpi, mpi-dim1, mpi-python, kokkos-openmp, mg8-tutorials]
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Verdict
        run: |
          echo "changes=${{ needs.changes.result }} set-mode=${{ needs.set-mode.result }} gate-cpp=${{ needs.gate-cpp.result }} gate-python-architecture=${{ needs.gate-python-architecture.result }} gate-python-build=${{ needs.gate-python-build.result }} gate-python=${{ needs.gate-python.result }} gate-python-compile-cache=${{ needs.gate-python-compile-cache.result }} mpi=${{ needs.mpi.result }} mpi-python=${{ needs.mpi-python.result }} kokkos-openmp=${{ needs.kokkos-openmp.result }} mg8-tutorials=${{ needs.mg8-tutorials.result }}"
          python3 scripts/ci_route_mode.py check \
            --gate changes "${{ needs.changes.result }}" true \
            --gate set-mode "${{ needs.set-mode.result }}" true \
            --gate gate-cpp "${{ needs.gate-cpp.result }}" true \
            --gate gate-python-architecture \
              "${{ needs.gate-python-architecture.result }}" \
              "${{ needs.set-mode.outputs.architecture_required }}" \
            --gate gate-python-build "${{ needs.gate-python-build.result }}" \
              "${{ needs.set-mode.outputs.python_required == 'true' || needs.set-mode.outputs.compile_cache_required == 'true' }}" \
            --gate gate-python "${{ needs.gate-python.result }}" \
              "${{ needs.set-mode.outputs.python_required }}" \
            --gate gate-python-compile-cache \
              "${{ needs.gate-python-compile-cache.result }}" \
              "${{ needs.set-mode.outputs.compile_cache_required }}" \
            --gate mpi "${{ needs.mpi.result }}" \
              "${{ needs.set-mode.outputs.mpi_required }}" \
            --gate mpi-dim1 "${{ needs.mpi-dim1.result }}" \
              "${{ needs.set-mode.outputs.mpi_required }}" \
            --gate mpi-python "${{ needs.mpi-python.result }}" \
              "${{ needs.set-mode.outputs.mpi_required }}" \
            --gate kokkos-openmp "${{ needs.kokkos-openmp.result }}" \
              "${{ needs.set-mode.outputs.openmp_required }}" \
            --gate mg8-tutorials "${{ needs.mg8-tutorials.result }}" \
              "${{ needs.set-mode.outputs.full == 'true' || needs.set-mode.outputs.python_required == 'true' }}"

  mpi:
    name: ubuntu-24.04 / MPI + Kokkos Serial + collective HDF5
    # Fixed distro release: OpenMPI and parallel HDF5 C libraries come from one
    # ABI-compatible Ubuntu package set. Python never owns an MPI communicator.
    runs-on: ubuntu-24.04
    # Native build, processor-grouped CTest and M4 lifecycle stay mandatory here.
    # Python MPI contracts consume one authenticated wheel in independent bounded jobs.
    timeout-minutes: 180
    needs: [set-mode, changes, gate-mpi-prewarm]
    outputs:
      python_mpi_matrix: ${{ steps.mpi-python-plan.outputs.matrix }}
      python_mpi_group_count: ${{ steps.mpi-python-plan.outputs.group_count }}
    # Suite complete, ou PR qui modifie directement le chemin distribue/MPI.
    if: needs.set-mode.outputs.mpi_required == 'true'

    env:
      POPS_NATIVE_DIM: "2"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: locale
      # Attempt-qualified publication preserves every valid MPI object compiled before a later
      # lifecycle/test failure. Restore prefixes remain branch/master scoped, so retries and the
      # next corrective push reuse prior work without ever overwriting an immutable Actions cache.
      CCACHE_CACHE_KEY: mpi-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      KOKKOS_VERSION: 4.4.01
      KOKKOS_COMMIT: 15dc143e5f39949eece972a798e175c4b463d4b8
      KOKKOS_PREFIX: ${{ github.workspace }}/.kokkos-install
      # The native matrix reaches np=4 and the HDF5 proof reaches np=2 on a
      # small runner. The root switches are inert on GitHub's non-root runner
      # and keep the launcher usable in equivalent containerized CI runs.
      OMPI_MCA_rmaps_base_oversubscribe: "true"
      PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
      # Ubuntu 24.04 OpenMPI 4 OMPIO selects sharedfp/lockedfile during
      # HDF5 MPI_File_open and aborts inside its fortified sprintf path.
      # ROMIO is the packaged OpenMPI MPI-IO component and exercises the
      # same collective HDF5 contract without that implementation defect.
      OMPI_MCA_io: "^ompio"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache libeigen3-dev libhdf5-openmpi-dev libopenmpi-dev ninja-build openmpi-bin \
            pybind11-dev python3-dev python3-h5py python3-venv python3-pip python3-packaging \
            python3-numpy python3-pytest python3-vtk9 python3-mpmath python3-scipy

      - name: Resolve runner and compiler cache identity
        id: kokkos-platform
        run: |
          image="${ImageOS:-}"
          if [ -z "$image" ]; then
            . /etc/os-release
            image="${ID}${VERSION_ID}"
          fi
          version="$(g++ -dumpfullversion -dumpversion)"
          version="$(printf '%s' "$version" | tr -c 'A-Za-z0-9._-' '-')"
          echo "key=${image}-${RUNNER_ARCH}-gcc-${version}" >> "$GITHUB_OUTPUT"

      # Meme install Kokkos Serial (PIC) que le gate, partagee uniquement si image, architecture et
      # version exacte de GCC concordent : jamais de reuse ABI entre ubuntu-latest et une autre image.
      - name: Cache Kokkos install (Serial ${{ env.KOKKOS_VERSION }})
        id: kokkos-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.KOKKOS_PREFIX }}
          key: kokkos-${{ runner.os }}-${{ steps.kokkos-platform.outputs.key }}-${{ env.KOKKOS_VERSION }}-${{ env.KOKKOS_COMMIT }}-serial-cxx20-pic

      - name: Build + install Kokkos (Serial, PIC)
        if: steps.kokkos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "${KOKKOS_VERSION}" https://github.com/kokkos/kokkos.git /tmp/kokkos
          test "$(git -C /tmp/kokkos rev-parse HEAD)" = "${KOKKOS_COMMIT}"
          cmake -S /tmp/kokkos -B /tmp/kbuild -G Ninja -DKokkos_ENABLE_SERIAL=ON \
            -DCMAKE_INSTALL_PREFIX="${KOKKOS_PREFIX}" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build /tmp/kbuild --parallel 4 --target install

      - name: Restore ccache (MPI)
        id: mpi-ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CCACHE_CACHE_KEY }}
          restore-keys: |
            ccache-${{ runner.os }}-mpi-${{ github.ref }}-
            ccache-${{ runner.os }}-mpi-refs/heads/master-
            ccache-${{ runner.os }}-mpi-

      - name: Download parallel MPI prewarm caches
        uses: actions/download-artifact@v8
        with:
          pattern: gate-mpi-prewarm-*
          path: ${{ github.workspace }}/.pops-ci/mpi-prewarm

      - name: Merge parallel MPI prewarm caches
        run: |
          mkdir -p "$CCACHE_DIR"
          mapfile -t cache_archives < <(
            find "${{ github.workspace }}/.pops-ci/mpi-prewarm" \
              -name 'mpi-prewarm-ccache-*.tar' -type f | sort
          )
          test "${#cache_archives[@]}" -eq 3
          for cache_archive in "${cache_archives[@]}"; do
            tar -C "$CCACHE_DIR" -xf "$cache_archive"
          done

      - name: Reset ccache stats (MPI)
        run: ccache --zero-stats

      - name: Select manifest-owned MPI tests
        id: mpi-test-plan
        run: |
          mkdir -p build-mpi
          python3 scripts/ci_select_tests.py cpp-label \
            --label mpi \
            --ctest-groups-file build-mpi/mpi-ctest-groups.tsv \
            --github-output "$GITHUB_OUTPUT" \
            --explain-file build-mpi/mpi-test-plan.json
          python3 scripts/ci_select_tests.py python-mpi \
            --plan-file build-mpi/python-mpi-plan.tsv \
            --orchestrator-plan-file build-mpi/python-mpi-orchestrators.txt \
            --github-output "$GITHUB_OUTPUT" \
            --explain-file build-mpi/python-mpi-plan.json
          test -s build-mpi/python-mpi-plan.tsv
          test -s build-mpi/python-mpi-orchestrators.txt
          test -s build-mpi/mpi-ctest-groups.tsv

      - name: Plan bounded MPI Python matrix
        id: mpi-python-plan
        run: |
          /usr/bin/python3 scripts/ci_python_mpi.py plan \
            --plan-file build-mpi/python-mpi-groups.json --github-output "$GITHUB_OUTPUT"

      - name: Configure + link Python module (MPI + Kokkos Serial)
        timeout-minutes: 20
        # Flags : preset ci-mpi (source unique, cf. CMakePresets.json) ; Kokkos_ROOT vient de
        # $KOKKOS_PREFIX (env du job, install en cache). ccache auto-detecte.
        run: |
          source scripts/ci_heartbeat.sh
          mpi_cmake_args=()
          if mpiexec --version 2>&1 | grep -Eqi 'Open MPI|OpenRTE'; then
            # FindMPI propagates these preflags to every manifest-owned CTest launch.
            # Non-OpenMPI launchers never receive an implementation-specific option.
            mpi_cmake_args+=("-DMPIEXEC_PREFLAGS=--mca;orte_abort_on_non_zero_status;1")
          fi
          cmake --preset ci-mpi \
            -DPOPS_NATIVE_DIM="$POPS_NATIVE_DIM" \
            -DPOPS_BUILD_PYTHON=ON \
            -DPOPS_USE_HDF5=ON \
            -DPython_EXECUTABLE=/usr/bin/python3 \
            "${mpi_cmake_args[@]}"
          mapfile -t compile_contracts < <(
            find "${{ github.workspace }}/.pops-ci/mpi-prewarm" \
              -name 'mpi-prewarm-contract-*.json' -type f | sort
          )
          test "${#compile_contracts[@]}" -eq 3
          python3 scripts/ci_python_module_objects.py \
            --build-dir build-mpi \
            --verify-contracts "${compile_contracts[@]}"
          export NINJA_STATUS='[%f/%t elapsed=%es active=%r] '
          # The monolithic Python module link is memory-heavy. Keep it isolated
          # from test compilation/linking so a small hosted runner cannot evict
          # its own worker under peak memory pressure.
          run_with_heartbeat "MPI Python module link" 14m \
            cmake --build --preset ci-mpi --parallel 1 --target _pops

      - name: Build complete native MPI inventory in three phases
        # SHA47b2 remaining phase hit28m at184/191tasks. Preserve each28m watchdog
        # and the60m total; split independent targets by the retained build costs.
        timeout-minutes: 60
        run: |
          source scripts/ci_heartbeat.sh
          test "${{ steps.mpi-test-plan.outputs.cpp_label_build_phase_count }}" -eq 3
          read -r -a isolated_targets <<< "${{ steps.mpi-test-plan.outputs.cpp_label_build_isolated_targets }}"
          read -r -a remaining0_targets <<< "${{ steps.mpi-test-plan.outputs.cpp_label_build_remaining0_targets }}"
          read -r -a remaining1_targets <<< "${{ steps.mpi-test-plan.outputs.cpp_label_build_remaining1_targets }}"
          test "${#isolated_targets[@]}" -gt 0
          test "${#remaining0_targets[@]}" -gt 0
          test "${#remaining1_targets[@]}" -gt 0
          test "$(( ${#isolated_targets[@]} + ${#remaining0_targets[@]} + ${#remaining1_targets[@]} ))" \
            -eq "${{ steps.mpi-test-plan.outputs.cpp_label_count }}"
          export NINJA_STATUS='[%f/%t elapsed=%es active=%r] '
          # The program runtime and loader DSOs remain isolated for peak memory.
          run_with_heartbeat "MPI isolated native test build" 28m \
            cmake --build --preset ci-mpi --parallel 1 --target "${isolated_targets[@]}"
          run_with_heartbeat "MPI remaining native test build0" 28m \
            cmake --build --preset ci-mpi --parallel 4 --target "${remaining0_targets[@]}"
          run_with_heartbeat "MPI remaining native test build1" 28m \
            cmake --build --preset ci-mpi --parallel 4 --target "${remaining1_targets[@]}"

      - name: Build M4 native tests
        timeout-minutes: 12
        run: |
          source scripts/ci_heartbeat.sh
          mapfile -t m4_targets < <(
            /usr/bin/python3 scripts/run_m4_gate.py --list-ctest-targets
          )
          test "${#m4_targets[@]}" -gt 0
          export NINJA_STATUS='[%f/%t elapsed=%es active=%r] '
          run_with_heartbeat "M4 native test build" 10m \
            cmake --build --preset ci-mpi --parallel 4 --target "${m4_targets[@]}"

      - name: Installed package smoke (MPI-only + collective HDF5)
        run: |
          # The configured CI package proves the full MPI+C+parallel-HDF5 export.
          ctest --preset ci-mpi --output-on-failure \
            --no-tests=error \
            -R '^test_installed_package_consumer$'

          # Configure a header-only MPI package without HDF5 to prove that its installed consumer
          # remains CXX-only and never acquires MPI_C/HDF5 as incidental dependencies.
          cmake -S . -B build-mpi-only-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKokkos_ROOT="${KOKKOS_PREFIX}" \
            -DPOPS_BUILD_TESTS=OFF \
            -DPOPS_BUILD_PYTHON=OFF \
            -DPOPS_INSTALL=ON \
            -DPOPS_USE_MPI=ON \
            -DPOPS_USE_HDF5=OFF
          cmake \
            -DPOPS_BINARY_DIR="${GITHUB_WORKSPACE}/build-mpi-only-package" \
            -DPOPS_CONSUMER_SOURCE_DIR="${GITHUB_WORKSPACE}/tests/cmake/installed_package_consumer" \
            -DPOPS_SMOKE_ROOT="${GITHUB_WORKSPACE}/build-mpi-only-package-smoke" \
            -DPOPS_BUILD_CONFIG=Release \
            -DPOPS_GENERATOR=Ninja \
            -DPOPS_DEPENDENCY_PREFIX_PATH="${KOKKOS_PREFIX}" \
            -DPOPS_Kokkos_DIR="${KOKKOS_PREFIX}/lib/cmake/Kokkos" \
            -DPOPS_MPI_CXX_COMPILER="$(command -v mpicxx)" \
            -DPOPS_EXPECT_MPI=ON \
            -DPOPS_EXPECT_HDF5=OFF \
            -DPOPS_EXPECT_PARALLEL_HDF5=OFF \
            -DPOPS_EXPECT_C_LOADED=OFF \
            -P tests/cmake/run_installed_package_smoke.cmake

      - name: Test (bit-identique np=1/2/4)
        timeout-minutes: 35
        # Les runners n'ont que 2-4 slots ; mpirun -np 4 a besoin d'oversubscribe.
        # OMPI_MCA_* couvre OpenMPI 4.x, PRTE_MCA_* couvre OpenMPI 5.x.
        # Les filtres sont ancres et conjoints : `mpi` seul inclurait aussi les smokes CMake/package
        # sans PROCESSORS, tandis que `backend` + `mpi` identifie exactement les lancements de rangs.
        # La suite Python marquee `mpi` est exclue de ce fence C++ car son launcher pytest ordinaire
        # n'ouvre aucun monde MPI ; ses vrais entrypoints sont lances sous mpiexec dans l'etape
        # suivante. Le manifeste reste l'autorite exacte des noms, labels et rangs C++ MPI. Chaque
        # groupe contient une seule reservation PROCESSORS : un np=2 bloque ne peut plus rester
        # devant un np=4 et empecher les tests suivants de demarrer. CTest conserve le TIMEOUT borne
        # de chaque test. Tous les groupes tournent meme si l'un echoue, puis l'etape echoue aussi.
        run: |
          mpi_inventory="$RUNNER_TEMP/ctest-mpi-plan.json"
          ctest --preset ci-mpi -N --show-only=json-v1 > "$mpi_inventory"
          python3 scripts/ci_select_tests.py verify-cpp-mpi-ctests \
            --ctest-json "$mpi_inventory"
          mpi_status=0
          mpi_count=0
          # Keep the manifest on fd 3: CTest may read stdin and must never consume the remaining
          # processor groups.  Its own stdin is closed explicitly for the same reason.
          while IFS=$'\t' read -r processors expected regex <&3; do
            test -n "$processors" && test "$expected" -gt 0 && test -n "$regex"
            echo "::notice::MPI CTest group processors=${processors}, launches=${expected}"
            group_inventory="$RUNNER_TEMP/ctest-mpi-group-${processors}.json"
            ctest --preset ci-mpi -N --show-only=json-v1 \
              -L '^backend$' -L '^mpi$' -LE '^python$' -R "$regex" \
              </dev/null > "$group_inventory"
            selected_count=$(python3 -c \
              'import json, sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))["tests"]))' \
              "$group_inventory")
            if [ "$selected_count" -ne "$expected" ]; then
              echo "::error::MPI CTest processor group ${processors} selected ${selected_count}/${expected} launches"
              mpi_status=1
              mpi_count=$((mpi_count + expected))
              continue
            fi
            set +e
            ctest --preset ci-mpi --output-on-failure --parallel 4 --no-tests=error \
              -L '^backend$' -L '^mpi$' -LE '^python$' -R "$regex" </dev/null
            group_status=$?
            set -e
            if [ "$group_status" -ne 0 ]; then
              echo "::error::MPI CTest processor group ${processors} failed (status=${group_status})"
              mpi_status=1
            fi
            mpi_count=$((mpi_count + expected))
          done 3< build-mpi/mpi-ctest-groups.tsv
          test "$mpi_count" -eq "${{ steps.mpi-test-plan.outputs.cpp_label_ctest_count }}"
          exit "$mpi_status"

      - name: Assemble and authenticate the unique MPI Dim2 wheel
        timeout-minutes: 8
        env:
          POPS_KOKKOS_ROOT: ${{ github.workspace }}/.kokkos-install
          Kokkos_ROOT: ${{ github.workspace }}/.kokkos-install
        run: |
          wheel_directory="$RUNNER_TEMP/pops-mpi-python-wheel"
          /usr/bin/python3 scripts/ci_assemble_installed_wheel.py \
            --package build-mpi/python --output-dir "$wheel_directory" \
            --dimension 2 --backend mpi
          cp build-mpi/python-mpi-groups.json "$wheel_directory/python-mpi-groups.json"
          /usr/bin/python3 scripts/ci_python_mpi.py authenticate \
            --wheel-directory "$wheel_directory" \
            --install-root "$RUNNER_TEMP/pops-mpi-producer-installed" \
            --receipt-dir "$wheel_directory/producer-proof"

      - name: Publish authenticated MPI Python wheel and exact group plan
        uses: actions/upload-artifact@v7
        with:
          name: gate-mpi-python-wheel
          path: ${{ runner.temp }}/pops-mpi-python-wheel/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: M4 complete native runtime and scientific I/O gate
        timeout-minutes: 45
        env:
          POPS_CI_TEST_EXECUTION: installed
          PYTHONNOUSERSITE: "1"
          POPS_NATIVE_DIM: "2"
          POPS_KOKKOS_ROOT: ${{ github.workspace }}/.kokkos-install
          Kokkos_ROOT: ${{ github.workspace }}/.kokkos-install
          POPS_CACHE_DIR: ${{ github.workspace }}/.pops-ci/m4-dsl-cache
          POPS_KEEP_GENERATED: "1"
          POPS_REQUIRE_MPI_TESTS: "1"
          POPS_REQUIRE_NATIVE_TESTS: "1"
        run: |
          # These readers are mandatory capabilities of this lane. Imports happen before the gate
          # so a missing apt module cannot masquerade as a scientific skip.
          env -u PYTHONPATH "$RUNNER_TEMP/pops-mpi-producer-installed/bin/python" - <<'PY'
          import h5py
          import numpy
          from vtkmodules.vtkIOXML import (
              vtkXMLPUnstructuredGridReader,
              vtkXMLUnstructuredGridReader,
          )

          print("M4 readers:", numpy.__version__, h5py.__version__)
          print(vtkXMLPUnstructuredGridReader, vtkXMLUnstructuredGridReader)
          PY
          env -u PYTHONPATH "$RUNNER_TEMP/pops-mpi-producer-installed/bin/python" scripts/run_m4_gate.py \
            --build-dir build-mpi \
            --mpi-exec mpiexec

      - name: ccache stats (MPI)
        if: always()
        run: ccache -s

      - name: Save ccache (MPI)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CCACHE_CACHE_KEY }}

  mpi-python:
    name: ubuntu-24.04 / MPI Python ${{ matrix.group }}
    runs-on: ubuntu-24.04
    # 15m cold dependencies + 8m wheel authentication + unchanged 35m tests + 2m receipts.
    timeout-minutes: 60
    needs: [set-mode, mpi]
    if: needs.set-mode.outputs.mpi_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mpi.outputs.python_mpi_matrix) }}
    env:
      POPS_NATIVE_DIM: "2"
      POPS_REQUIRE_NATIVE_TESTS: "1"
      POPS_REQUIRE_MPI_TESTS: "1"
      PYTHONNOUSERSITE: "1"
      POPS_KOKKOS_ROOT: ${{ github.workspace }}/.kokkos-install
      Kokkos_ROOT: ${{ github.workspace }}/.kokkos-install
      OMP_NUM_THREADS: "2"
      OMP_PROC_BIND: "false"
      OMPI_MCA_rmaps_base_oversubscribe: "true"
      PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
      OMPI_MCA_io: "^ompio"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-kokkos
        with:
          extra-apt: libhdf5-openmpi-dev libopenmpi-dev openmpi-bin pybind11-dev python3-dev python3-venv python3-pip python3-packaging python3-numpy python3-pytest python3-h5py python3-mpmath python3-scipy python3-vtk9
      - name: Download the unique authenticated MPI Dim2 wheel
        uses: actions/download-artifact@v8
        with:
          name: gate-mpi-python-wheel
          path: ${{ runner.temp }}/pops-mpi-python-wheel
      - name: Authenticate fresh MPI wheel installation
        timeout-minutes: 8
        run: |
          /usr/bin/python3 scripts/ci_python_mpi.py authenticate \
            --wheel-directory "$RUNNER_TEMP/pops-mpi-python-wheel" \
            --install-root "$RUNNER_TEMP/pops-mpi-python-installed" \
            --receipt-dir "$RUNNER_TEMP/pops-mpi-python-receipts/installation"
      - name: Execute every mandatory contract in the bounded MPI group
        timeout-minutes: 35
        env:
          MPI_PYTHON_GROUP: ${{ matrix.group }}
          POPS_CI_MPI_ENTRYPOINT_RECEIPTS: ${{ runner.temp }}/pops-mpi-python-receipts/ranked-pytest
        run: |
          /usr/bin/python3 scripts/ci_python_mpi.py run \
            --plan-file "$RUNNER_TEMP/pops-mpi-python-wheel/python-mpi-groups.json" \
            --group "$MPI_PYTHON_GROUP" \
            --wheel-directory "$RUNNER_TEMP/pops-mpi-python-wheel" \
            --install-root "$RUNNER_TEMP/pops-mpi-python-installed" \
            --receipt-dir "$RUNNER_TEMP/pops-mpi-python-receipts/execution"
      - name: Publish MPI group installation and execution receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpi-python-${{ matrix.group }}
          path: ${{ runner.temp }}/pops-mpi-python-receipts/
          if-no-files-found: error
          retention-days: 1

  # PREWARM OPENMP NATIF. Une invalidation froide des en-tetes de production ne doit pas forcer
  # chacun des shards C++ ni le module Python a recompiler leur socle runtime avant leurs
  # executables/bindings. Les graphes C++ et Python ont volontairement des defines/visibilites
  # differents : chaque graphe possede donc ses trois lanes semantiques exactes. Elles publient
  # uniquement ccache et le contrat compilateur/flags/revision/sources ; aucun binaire lie n'est
  # transmis, et chaque consommateur reconfigure puis authentifie son propre contrat.
  gate-openmp-prewarm:
    name: ubuntu-latest / Kokkos OpenMP (${{ matrix.graph }} prewarm ${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 32
    needs: set-mode
    if: needs.set-mode.outputs.openmp_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        graph: [cpp, python]
        lane: [system, amr-runtime, amr-fields]

    env:
      POPS_NATIVE_DIM: "2"
      CCACHE_DIR: ${{ github.workspace }}/.ccache-openmp-prewarm
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: locale
      KOKKOS_VERSION: 4.4.01
      KOKKOS_COMMIT: 15dc143e5f39949eece972a798e175c4b463d4b8
      KOKKOS_PREFIX: ${{ github.workspace }}/.kokkos-openmp-install

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        if: matrix.graph == 'python'
        with:
          python-version: '3.12'

      - name: Install OpenMP prewarm dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev ninja-build ccache mold

      - name: Install MPI SDK before Python prewarm capture
        if: matrix.graph == 'python'
        run: sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Resolve OpenMP prewarm platform identity
        id: openmp-prewarm-platform
        run: |
          image="${ImageOS:-}"
          if [ -z "$image" ]; then
            . /etc/os-release
            image="${ID}${VERSION_ID}"
          fi
          version="$(g++ -dumpfullversion -dumpversion)"
          version="$(printf '%s' "$version" | tr -c 'A-Za-z0-9._-' '-')"
          echo "key=${image}-${RUNNER_ARCH}-gcc-${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Kokkos install (OpenMP prewarm)
        id: openmp-prewarm-kokkos-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.KOKKOS_PREFIX }}
          key: kokkos-${{ runner.os }}-${{ steps.openmp-prewarm-platform.outputs.key }}-${{ env.KOKKOS_VERSION }}-${{ env.KOKKOS_COMMIT }}-openmp-cxx20-pic

      - name: Build + install Kokkos (OpenMP prewarm)
        if: steps.openmp-prewarm-kokkos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "${KOKKOS_VERSION}" \
            https://github.com/kokkos/kokkos.git /tmp/kokkos-omp
          test "$(git -C /tmp/kokkos-omp rev-parse HEAD)" = "${KOKKOS_COMMIT}"
          cmake -S /tmp/kokkos-omp -B /tmp/kbuild-omp -G Ninja \
            -DKokkos_ENABLE_OPENMP=ON \
            -DCMAKE_INSTALL_PREFIX="${KOKKOS_PREFIX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build /tmp/kbuild-omp --parallel 4 --target install
          rm -rf "${CCACHE_DIR}"
          mkdir -p "${CCACHE_DIR}"

      # Le cache transporte uniquement les objets produits par cette lane et ce checkout. Un ancien
      # cache de shard (ou les objets de bootstrap Kokkos) gonflerait sinon l'artefact et brouillerait
      # l'autorite du contrat courant.
      - name: Initialize exact OpenMP prewarm ccache
        run: |
          rm -rf "${CCACHE_DIR}"
          mkdir -p "${CCACHE_DIR}"

      - name: Prewarm OpenMP production runtime objects (${{ matrix.graph }}, ${{ matrix.lane }})
        run: |
          source scripts/ci_heartbeat.sh
          # Deux frontends sont la limite observee sans pression memoire dangereuse sur les
          # runners publics OpenMP. Les lanes restent executees en parallele.
          lane_parallelism=2
          export NINJA_STATUS='[%f/%t elapsed=%es active=%r] '
          if [ "${{ matrix.graph }}" = "python" ]; then
            preset=ci-kokkos-python
            build_dir=build-kokkos-py
            pool_option=POPS_HEAVY_MODULE_TU_POOL
          else
            preset=ci-kokkos
            build_dir=build-kokkos
            pool_option=POPS_HEAVY_TEST_TU_POOL
          fi
          cmake --preset "$preset" -DCMAKE_LINKER_TYPE=MOLD \
            -DPOPS_NATIVE_DIM="$POPS_NATIVE_DIM" \
            -D"${pool_option}=$lane_parallelism" \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=${{ github.workspace }}=."
          python3 scripts/ci_python_module_objects.py --build-dir "$build_dir" --verify
          ccache --zero-stats
          mapfile -t object_targets < <(
            python3 scripts/ci_python_module_objects.py \
              --build-dir "$build_dir" \
              --lane "${{ matrix.lane }}" \
              --contract-file \
                "$RUNNER_TEMP/openmp-prewarm-${{ matrix.graph }}-contract-${{ matrix.lane }}.json"
          )
          test "${#object_targets[@]}" -gt 0
          run_with_heartbeat "OpenMP ${{ matrix.graph }} prewarm ${{ matrix.lane }}" 24m \
            cmake --build --preset "$preset" --parallel "$lane_parallelism" \
              --target "${object_targets[@]}"
          ccache -s
          tar -C "$CCACHE_DIR" \
            -cf \
              "$RUNNER_TEMP/openmp-prewarm-${{ matrix.graph }}-ccache-${{ matrix.lane }}.tar" .

      - name: Upload OpenMP prewarm cache and compile contract
        uses: actions/upload-artifact@v7
        with:
          name: gate-openmp-prewarm-${{ matrix.graph }}-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/openmp-prewarm-${{ matrix.graph }}-ccache-${{ matrix.lane }}.tar
            ${{ runner.temp }}/openmp-prewarm-${{ matrix.graph }}-contract-${{ matrix.lane }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  kokkos-openmp:
    # The OpenMP C++ proof is the same exact fourteen-way target partition as the Serial gate:
    # every non-MPI target belongs to exactly one shard and every built target must expose
    # an authenticated CTest label before its cases can run.  The independent Python/native-ABI
    # proof stays in its own lane because it builds one module rather than the C++ test graph.
    name: ubuntu-latest / Kokkos (OpenMP, ${{ matrix.lane }})
    runs-on: ubuntu-latest
    # Les shards C++ recoivent le socle runtime du prewarm courant ; leur watchdog de 38 minutes
    # reste une borne fail-closed pour verification, objets de tests et liens. La lane Python
    # conserve son garde de build de 45 minutes et six phases natives independantes.
    # Python: 47 min de step build + 6 x 16 min de tests + 17 min de setup/cache/nettoyage.
    timeout-minutes: ${{ matrix.kind == 'python' && 160 || 70 }}
    needs: [set-mode, gate-openmp-prewarm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: cpp-0
            kind: cpp
            shard: 0
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-1
            kind: cpp
            shard: 1
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-2
            kind: cpp
            shard: 2
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-3
            kind: cpp
            shard: 3
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-4
            kind: cpp
            shard: 4
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-5
            kind: cpp
            shard: 5
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-6
            kind: cpp
            shard: 6
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-7
            kind: cpp
            shard: 7
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-8
            kind: cpp
            shard: 8
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-9
            kind: cpp
            shard: 9
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-10
            kind: cpp
            shard: 10
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-11
            kind: cpp
            shard: 11
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-12
            kind: cpp
            shard: 12
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-13
            kind: cpp
            shard: 13
            shard_total: 15
            ccache_maxsize: 2G
          - lane: cpp-14
            kind: cpp
            shard: 14
            shard_total: 15
            ccache_maxsize: 2G
          - lane: python
            kind: python
            shard: 0
            shard_total: 1
            ccache_maxsize: 2G
    # Teste le backend KOKKOS avec l'espace d'execution OpenMP (CPU multi-thread). Le gate
    # build-and-test couvre deja Kokkos Serial (mono-thread) ; ce job ferme le multi-thread.
    # Suite complete uniquement (push master / nightly / dispatch / PR label `ci-full`).
    if: needs.set-mode.outputs.openmp_required == 'true'

    env:
      POPS_NATIVE_DIM: "2"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Chaque lane C++ fusionne le socle runtime OpenMP prechauffe avant d'ajouter les objets de
      # sa partition du graphe. Deux Gio evitent d'evincer immediatement ce socle authentifie.
      # La lane Python conserve le meme budget pour son module de production unique.
      CCACHE_MAXSIZE: ${{ matrix.ccache_maxsize }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: locale
      # Prefixe SEPARE du Kokkos Serial pour eviter toute collision de cache.
      # Meme version de Kokkos, espace d'execution OpenMP.
      KOKKOS_VERSION: 4.4.01
      KOKKOS_COMMIT: 15dc143e5f39949eece972a798e175c4b463d4b8
      KOKKOS_PREFIX: ${{ github.workspace }}/.kokkos-openmp-install
      # Attempt-qualified, lane-specific publication lets an always() save retain
      # valid objects from a failed bounded build without cpp/python cache races.
      CCACHE_CACHE_KEY: kokkos-openmp-${{ matrix.lane }}-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Every OpenMP native phase uses the same two-thread runtime and fails on
      # missing prerequisites. Runtime-compiled loaders must use the module's Kokkos.
      OMP_NUM_THREADS: "2"
      OMP_PROC_BIND: "false"
      POPS_REQUIRE_NATIVE_TESTS: "1"
      Kokkos_ROOT: ${{ github.workspace }}/.kokkos-openmp-install
      POPS_KOKKOS_ROOT: ${{ github.workspace }}/.kokkos-openmp-install

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Select complete OpenMP C++ shard
        id: openmp-cpp-plan
        if: matrix.kind == 'cpp'
        run: |
          python3 scripts/ci_select_tests.py cpp \
            --changed-files /dev/null \
            --force-all \
            --shard-index "${{ matrix.shard }}" \
            --shard-total "${{ matrix.shard_total }}" \
            --github-output "$GITHUB_OUTPUT" \
            --explain-file "$RUNNER_TEMP/openmp-cpp-test-plan.json"
          {
            echo "### OpenMP C++ test selection"
            echo ""
            echo "- ${{ matrix.lane }}: $(grep '^cpp_shard_summary=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
            echo "- complete suite: $(grep '^cpp_summary=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
            echo "- plan: artifact \`openmp-cpp-test-plan-shard-${{ matrix.shard }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OpenMP C++ test plan
        if: matrix.kind == 'cpp'
        uses: actions/upload-artifact@v7
        with:
          name: openmp-cpp-test-plan-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/openmp-cpp-test-plan.json

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev ninja-build ccache mold

      - name: Install MPI SDK for required Python syntax witnesses
        if: matrix.kind == 'python'
        run: sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Fingerprint installed OpenMP compiler include trees
        id: openmp-compiler-includes
        if: matrix.kind == 'python'
        run: |
          python3 scripts/ci_compiler_include_identity.py --compiler g++ \
            --output "$RUNNER_TEMP/pops-ci-compiler-include-identity.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve runner and compiler cache identity
        id: kokkos-platform
        run: |
          image="${ImageOS:-}"
          if [ -z "$image" ]; then
            . /etc/os-release
            image="${ID}${VERSION_ID}"
          fi
          version="$(g++ -dumpfullversion -dumpversion)"
          version="$(printf '%s' "$version" | tr -c 'A-Za-z0-9._-' '-')"
          echo "key=${image}-${RUNNER_ARCH}-gcc-${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        id: openmp-python
        if: matrix.kind == 'python'
        with:
          python-version: '3.12'
          cache: pip

      # Cache du Kokkos DEJA INSTALLE. Image, architecture et version GCC exactes interdisent une
      # reuse ABI-incompatible; "openmp" isole cette installation du cache Serial.
      - name: Cache Kokkos install (OpenMP ${{ env.KOKKOS_VERSION }})
        id: kokkos-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.KOKKOS_PREFIX }}
          key: kokkos-${{ runner.os }}-${{ steps.kokkos-platform.outputs.key }}-${{ env.KOKKOS_VERSION }}-${{ env.KOKKOS_COMMIT }}-openmp-cxx20-pic

      # The ccache working set for all 35 production objects is larger than its intentionally
      # bounded 2 GiB rolling cache.  Authenticate and retain the much smaller final module too:
      # unchanged native inputs can reuse the exact OpenMP binary even if ccache evicted an object.
      # The key has no fallback: source, build graph, toolchain, or Kokkos drift must rebuild.
      - name: Cache exact OpenMP Python module
        id: openmp-python-module-cache
        if: matrix.kind == 'python'
        uses: actions/cache@v6
        with:
          path: build-kokkos-py/python/pops
          key: pops-module-openmp-dim2-${{ runner.os }}-${{ steps.kokkos-platform.outputs.key }}-headers${{ steps.openmp-compiler-includes.outputs.identity }}-py${{ steps.openmp-python.outputs.python-version }}-${{ hashFiles('include/**', 'src/**', 'python/bindings/**', 'python/CMakeLists.txt', 'CMakeLists.txt', 'cmake/**', 'CMakePresets.json', 'pyproject.toml', '.github/workflows/ci.yml', 'scripts/ci_compiler_include_identity.py', 'scripts/write_compiler_include_contract.py', 'python/pops/codegen/_compiler_include_tree.py') }}-kokkos${{ env.KOKKOS_VERSION }}-${{ env.KOKKOS_COMMIT }}

      - name: Build + install Kokkos (OpenMP)
        # Reconstruit Kokkos UNIQUEMENT sur cache miss.
        # Kokkos_ENABLE_OPENMP=ON : l'exec space par defaut devient OpenMP.
        if: steps.kokkos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "${KOKKOS_VERSION}" https://github.com/kokkos/kokkos.git /tmp/kokkos-omp
          test "$(git -C /tmp/kokkos-omp rev-parse HEAD)" = "${KOKKOS_COMMIT}"
          cmake -S /tmp/kokkos-omp -B /tmp/kbuild-omp -G Ninja -DKokkos_ENABLE_OPENMP=ON \
            -DCMAKE_INSTALL_PREFIX="${KOKKOS_PREFIX}" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build /tmp/kbuild-omp --parallel 4 --target install
          # The exact Kokkos install above is the reusable artifact.  Its temporary compiler-cache
          # entries must not consume the bounded PoPS shard cache restored by the next step.
          rm -rf "${CCACHE_DIR}"
          mkdir -p "${CCACHE_DIR}"

      # Restore the PoPS object cache only after a possible Kokkos bootstrap. Both builds use
      # ccache, but Kokkos objects are covered by their own exact install cache and must not evict
      # the PoPS working set before the authenticated current-run prewarm is merged.
      - name: Restore ccache (Kokkos OpenMP, ${{ matrix.lane }})
        if: matrix.kind != 'python' || steps.openmp-python-module-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CCACHE_CACHE_KEY }}
          restore-keys: |
            ccache-${{ runner.os }}-kokkos-openmp-${{ matrix.lane }}-${{ github.ref }}-
            ccache-${{ runner.os }}-kokkos-openmp-${{ matrix.lane }}-refs/heads/master-

      - name: Reset ccache stats (Kokkos OpenMP, ${{ matrix.lane }})
        if: matrix.kind != 'python' || steps.openmp-python-module-cache.outputs.cache-hit != 'true'
        run: ccache --zero-stats

      - name: Download parallel OpenMP prewarm caches
        if: matrix.kind == 'cpp' || steps.openmp-python-module-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: gate-openmp-prewarm-${{ matrix.kind }}-*
          path: ${{ github.workspace }}/.pops-ci/openmp-prewarm

      - name: Merge parallel OpenMP prewarm caches
        if: matrix.kind == 'cpp' || steps.openmp-python-module-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CCACHE_DIR"
          mapfile -t cache_archives < <(
            find "${{ github.workspace }}/.pops-ci/openmp-prewarm" \
              -name 'openmp-prewarm-${{ matrix.kind }}-ccache-*.tar' -type f | sort
          )
          test "${#cache_archives[@]}" -eq 3
          for cache_archive in "${cache_archives[@]}"; do
            tar -C "$CCACHE_DIR" -xf "$cache_archive"
          done
          ccache --zero-stats

      - name: Configure + build (backend Kokkos OpenMP)
        if: matrix.kind == 'cpp'
        # Le socle runtime froid est construit une seule fois par les trois lanes semantiques. Ce
        # shard reconfigure le graphe officiel, authentifie les trois contrats puis ne compile que
        # ses executables/tests propres ; le watchdog reste un garde-fou, pas le mecanisme de vitesse.
        timeout-minutes: 43
        # MEME preset ci-kokkos que le job Serial (binaryDir build-kokkos) : seule l'install
        # Kokkos pointee par $KOKKOS_PREFIX differe ; les runners sont des machines distinctes.
        run: |
          source scripts/ci_heartbeat.sh
          export NINJA_STATUS='[%f/%t elapsed=%es active=%r] '
          cmake --preset ci-kokkos -DCMAKE_LINKER_TYPE=MOLD \
            -DPOPS_NATIVE_DIM="$POPS_NATIVE_DIM" \
            -DPOPS_HEAVY_TEST_TU_POOL=2 \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=${{ github.workspace }}=."
          mapfile -t compile_contracts < <(
            find "${{ github.workspace }}/.pops-ci/openmp-prewarm" \
              -name 'openmp-prewarm-cpp-contract-*.json' -type f | sort
          )
          test "${#compile_contracts[@]}" -eq 3
          python3 scripts/ci_python_module_objects.py \
            --build-dir build-kokkos \
            --verify-contracts "${compile_contracts[@]}"
          read -r -a cpp_targets <<< "${{ steps.openmp-cpp-plan.outputs.cpp_shard_targets }}"
          if [ "${#cpp_targets[@]}" -eq 0 ]; then
            echo "::error::OpenMP C++ shard ${{ matrix.shard }} selected no targets from the forced complete suite"
            exit 1
          fi
          run_with_heartbeat "Kokkos OpenMP C++ shard ${{ matrix.shard }} build" 38m \
            cmake --build --preset ci-kokkos --parallel 2 --target "${cpp_targets[@]}"

      - name: Test (ctest, backend Kokkos OpenMP)
        if: matrix.kind == 'cpp'
        timeout-minutes: 17
        # OMP_NUM_THREADS=2 : le runner GitHub est petit (2 vCPU) ; sans borne,
        # Kokkos detecte le nombre de coeurs logiques et lance N threads qui se
        # battent, ce qui provoque des suites-tests lentes ou tues (OOM/timeout).
        # OMP_PROC_BIND=false : les runners GitHub ne permettent pas l'affinite
        # de threads (KMP_AFFINITY=disabled equivalent) ; sans ce flag, OpenMP peut
        # echouer avec "Cannot bind threads" sur certaines images runner.
        env:
          OMP_NUM_THREADS: "2"
          OMP_PROC_BIND: "false"
        run: |
          read -r -a cpp_targets <<< "${{ steps.openmp-cpp-plan.outputs.cpp_shard_targets }}"
          ctest_inventory="$RUNNER_TEMP/ctest-openmp-shard-${{ matrix.shard }}.json"
          ctest --preset ci-kokkos -N --show-only=json-v1 > "$ctest_inventory"
          python3 scripts/ci_select_tests.py verify-cpp-target-labels \
            --ctest-json "$ctest_inventory" \
            --targets "${cpp_targets[@]}"
          test_watchdog=7m
          set +e
          timeout --signal=TERM --kill-after=30s "$test_watchdog" \
            ctest --preset ci-kokkos --parallel 2 \
              -L '${{ steps.openmp-cpp-plan.outputs.cpp_shard_label_regex }}'
          ctest_status=$?
          set -e
          if [ "$ctest_status" -eq 124 ]; then
            echo "::error::Kokkos OpenMP shard ${{ matrix.shard }} CTest exceeded its ${test_watchdog} watchdog"
          fi
          exit "$ctest_status"

      - name: Install OpenMP Python test dependencies
        if: matrix.kind == 'python'
        run: pip install --upgrade pip numpy pytest h5py scipy 'mpmath>=1.3.0'

      - name: Reuse exact OpenMP module and sync Python sources
        if: matrix.kind == 'python' && steps.openmp-python-module-cache.outputs.cache-hit == 'true'
        run: |
          # Pure-Python and typing sources are intentionally outside the native cache key.  Force
          # their contents from this checkout while protecting variants.json and its Dim=2 leaf.
          rsync -aI --delete --include='*/' --include='*.py' --include='*.pyi' \
            --include='py.typed' --exclude='_native/***' --exclude='*' \
            python/pops/ build-kokkos-py/python/pops/
          echo "Exact authenticated OpenMP module cache hit; native rebuild skipped." \
            >> "$GITHUB_STEP_SUMMARY"

      # GARDE-FOU ABI std (regression GH200). Sous Kokkos le module _pops est compile en C++20
      # (POPS_CXX_STD=20, CUDA 12.x sans -std=c++23) tandis que le DSL backend="production" figeait
      # le std du modele natif a c++23 -> cles d'ABI divergentes -> add_native_block rejetait tout
      # bloc natif. Aucun job CI ne couvrait ce chemin (le modele production est compile au RUNTIME,
      # pas en CI). On construit donc ICI le module Python AVEC Kokkos (loader c++20) puis on exerce
      # les tests qui compilent un modele production et appellent add_native_block : ils echoueraient
      # avec l'ancien defaut c++23, ils passent avec le std aligne sur le loader.
      - name: Build module Python `pops` (backend Kokkos OpenMP)
        if: matrix.kind == 'python' && steps.openmp-python-module-cache.outputs.cache-hit != 'true'
        timeout-minutes: 47
        run: |
          # Keep this runtime lane capability-equivalent to the serial Python gate for the final
          # examples and output reopen checks; collective HDF5 stays in the dedicated MPI job.
          source scripts/ci_heartbeat.sh
          export NINJA_STATUS='[%f/%t elapsed=%es active=%r] '
          # Cold OpenMP evidence (job 87543770170) showed cc1plus=1 throughout, 20/37 objects
          # after 43 minutes, and 9.4--14.9 GiB still available.  The post-split production TUs
          # therefore use two of the runner's four compile slots: measured peak per-TU memory can
          # approach 5.5 GiB, so a third concurrent heavy TU would not fit the 15 GiB runner safely.
          # Two-way concurrency still halves the observed one-TU critical path and fits the
          # unchanged 45-minute cold-build watchdog without relying on an OOM-prone assumption.
          # The same 35-object graph completed cold with pool=4 in 29 minutes on the Serial lane.
          cmake --preset ci-kokkos-python -DCMAKE_LINKER_TYPE=MOLD \
            -DPOPS_NATIVE_DIM="$POPS_NATIVE_DIM" \
            -DPOPS_HEAVY_MODULE_TU_POOL=2 \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=${{ github.workspace }}=."
          mapfile -t compile_contracts < <(
            find "${{ github.workspace }}/.pops-ci/openmp-prewarm" \
              -name 'openmp-prewarm-python-contract-*.json' -type f | sort
          )
          test "${#compile_contracts[@]}" -eq 3
          python3 scripts/ci_python_module_objects.py \
            --build-dir build-kokkos-py \
            --verify-contracts "${compile_contracts[@]}"
          run_with_heartbeat "Kokkos OpenMP Python module build" 45m \
            cmake --build --preset ci-kokkos-python

      - name: Authenticate Dim=2 OpenMP Python native variant
        if: matrix.kind == 'python'
        env:
          PYTHONPATH: ${{ github.workspace }}/build-kokkos-py/python
          PYTHONNOUSERSITE: "1"
        run: >-
          python3 scripts/verify_installed_native.py
          --expect-dim "$POPS_NATIVE_DIM" --expect-serial

      # ADC-548 (a): this add_native_block section is the bind-RUN / ProgramContext EXECUTION smoke --
      # it compiles a production model at runtime and actually RUNS it (System + AMR) via
      # add_native_block, the counterpart to the compile/bind smoke carried on the fast gate
      # (gate-python-compile-cache). The full lane carries the bind-RUN proof; the gate lane the compile-BIND.
      # Each file keeps its own native process watchdog (up to 900 s). A 16-minute
      # step allows pytest startup/reporting without sharing one 15-minute deadline
      # across all six cold-compilation phases. The built module is reused throughout;
      # every nonzero exit, including teardown failures, remains fatal.
      - name: Test ABI natif (C++ standard and loader)
        if: matrix.kind == 'python'
        timeout-minutes: 16
        env:
          PYTHONPATH: ${{ github.workspace }}/build-kokkos-py/python
        run: python3 -m pytest -q tests/python/integration/native_loader/test_native_abi_std.py

      - name: Test ABI natif (production System)
        if: matrix.kind == 'python'
        timeout-minutes: 16
        env:
          PYTHONPATH: ${{ github.workspace }}/build-kokkos-py/python
        run: python3 -m pytest -q tests/python/integration/native_loader/test_dsl_production.py

      - name: Test ABI natif (AMR transport, HLLC and WENO)
        if: matrix.kind == 'python'
        timeout-minutes: 16
        env:
          PYTHONPATH: ${{ github.workspace }}/build-kokkos-py/python
        run: python3 -m pytest -q tests/python/integration/native_loader/test_dsl_production_amr.py

      - name: Test ABI natif (AMR Euler-Poisson)
        if: matrix.kind == 'python'
        timeout-minutes: 16
        env:
          PYTHONPATH: ${{ github.workspace }}/build-kokkos-py/python
        run: python3 -m pytest -q tests/python/integration/native_loader/test_dsl_production_amr_poisson.py

      - name: Test ABI natif (AMR Roe reconstruction parity)
        if: matrix.kind == 'python'
        timeout-minutes: 16
        env:
          PYTHONPATH: ${{ github.workspace }}/build-kokkos-py/python
        run: python3 -m pytest -q tests/python/integration/native_loader/test_dsl_production_amr_roe.py

      - name: Test ABI natif (AMR contract guards)
        if: matrix.kind == 'python'
        timeout-minutes: 16
        env:
          PYTHONPATH: ${{ github.workspace }}/build-kokkos-py/python
        run: python3 -m pytest -q tests/python/integration/native_loader/test_dsl_production_amr_guards.py

      - name: ccache stats (Kokkos OpenMP, ${{ matrix.lane }})
        if: ${{ always() && (matrix.kind != 'python' || steps.openmp-python-module-cache.outputs.cache-hit != 'true') }}
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache -s
          else
            echo "ccache was not installed because this job stopped before dependency setup"
          fi

      - name: Save ccache (Kokkos OpenMP, ${{ matrix.lane }})
        if: ${{ always() && (matrix.kind != 'python' || steps.openmp-python-module-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CCACHE_CACHE_KEY }}

  # MG8 (spec 0.3, section 18.2; N5 landing plan, section 6.2): the 17 tutorials of
  # docs/tutorials/scalar_advection run once from master bb9aea0c and once from this tree, on the
  # same runner, and scripts/run_mg8_tutorials.py compares every result bitwise under
  # tests/gates/mg8_master_tutorials.toml. The reference is rebuilt on each runner: NumPy's and
  # glibc's elementary functions dispatch on CPU features, so arrays stored from another machine
  # would compare two machines, not two trees. Master's packages are fixed by its commit and
  # cached; this tree's packages are built with the ccache of the Python and MPI lanes. A difference
  # is recorded in the contract with its causes; a failure always fails the job (CF14). It runs on
  # every plan that needs the Python lane, so a change of a route that a tutorial uses runs it
  # (MG8-1). Each run step has a budget and each tutorial a watchdog under it; reports are written
  # after every tutorial and the comparison runs after a step that fails or times out, so its
  # summary names the tutorial that did not finish. The job's limit is the sum of the bounded
  # steps (45 + 45 + 45 + 45 + 60 + 15 = 255 min) and of the setup.
  mg8-tutorials:
    name: ubuntu-24.04 / MG8 master tutorials (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 285
    needs: [set-mode]
    if: needs.set-mode.outputs.full == 'true' || needs.set-mode.outputs.python_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        lane: [serial-dim2, mpi-dim2, serial-dim3]

    env:
      MG8_MASTER: bb9aea0cc56fabe6b003bfbee5daee28d38ac7e7
      CCACHE_DIR: ${{ github.workspace }}/.ccache-mg8
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: locale
      CCACHE_CACHE_KEY: mg8-${{ matrix.lane }}-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      KOKKOS_PREFIX: ${{ github.workspace }}/.kokkos-install
      OMPI_MCA_rmaps_base_oversubscribe: "true"
      PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
      OMPI_MCA_io: "^ompio"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check out master's tutorials and sources
        uses: actions/checkout@v7
        with:
          ref: bb9aea0cc56fabe6b003bfbee5daee28d38ac7e7
          path: .mg8/master
          fetch-depth: 1

      - id: kokkos
        uses: ./.github/actions/setup-kokkos
        with:
          extra-apt: mold libopenmpi-dev openmpi-bin libhdf5-openmpi-dev

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the tutorials' Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib 'pybind11==2.13.6'
          python -c "import numpy, matplotlib; print('numpy', numpy.__version__, 'matplotlib', matplotlib.__version__)"

      - name: Resolve the lane
        id: lane
        run: |
          case "${{ matrix.lane }}" in
            serial-dim2) echo "dimension=2" >> "$GITHUB_OUTPUT"; echo "mpi=false" >> "$GITHUB_OUTPUT" ;;
            mpi-dim2) echo "dimension=2" >> "$GITHUB_OUTPUT"; echo "mpi=true" >> "$GITHUB_OUTPUT" ;;
            serial-dim3) echo "dimension=3" >> "$GITHUB_OUTPUT"; echo "mpi=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown MG8 lane ${{ matrix.lane }}"; exit 2 ;;
          esac

      # Master never changes: its package is keyed by the commit, the toolchain and the Python,
      # and saved right after its build, even when a later step fails.
      - name: Restore master's package (${{ matrix.lane }})
        id: master-package
        uses: actions/cache/restore@v6
        with:
          path: .mg8/master-package
          key: mg8-master-package-${{ matrix.lane }}-${{ env.MG8_MASTER }}-${{ runner.os }}-${{ steps.kokkos.outputs.cache-platform }}-headers${{ steps.kokkos.outputs.compiler-includes }}-py${{ steps.python.outputs.python-version }}-kokkos4.4.01-15dc143e

      - name: Restore ccache (MG8 ${{ matrix.lane }})
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CCACHE_CACHE_KEY }}
          restore-keys: |
            ccache-${{ runner.os }}-mg8-${{ matrix.lane }}-${{ github.ref }}-
            ccache-${{ runner.os }}-mg8-${{ matrix.lane }}-refs/heads/master-
            ccache-${{ runner.os }}-${{ steps.lane.outputs.mpi == 'true' && 'mpi' || format('python-build-dim{0}', steps.lane.outputs.dimension) }}-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ steps.lane.outputs.mpi == 'true' && 'mpi' || format('python-build-dim{0}', steps.lane.outputs.dimension) }}-refs/heads/master-

      - name: Build master's package (${{ matrix.lane }})
        if: steps.master-package.outputs.cache-hit != 'true'
        timeout-minutes: 45
        run: |
          source scripts/ci_heartbeat.sh
          export NINJA_STATUS='[%f/%t elapsed=%es active=%r] '
          mpi_args=()
          if [ "${{ steps.lane.outputs.mpi }}" = "true" ]; then
            mpi_args+=(-DPOPS_USE_MPI=ON -DPOPS_USE_HDF5=ON)
          fi
          cmake -S .mg8/master -B .mg8/master-build --preset ci-python \
            -DPOPS_NATIVE_DIM="${{ steps.lane.outputs.dimension }}" \
            -DKokkos_ROOT="$KOKKOS_PREFIX" \
            -DPOPS_HEAVY_MODULE_TU_POOL=4 \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "${mpi_args[@]}"
          run_with_heartbeat "master package ${{ matrix.lane }}" 40m \
            cmake --build .mg8/master-build --parallel 4
          rm -rf .mg8/master-package
          mkdir -p .mg8/master-package
          cp -rL .mg8/master-build/python/pops .mg8/master-package/pops
          rm -rf .mg8/master-build

      - name: Save master's package (${{ matrix.lane }})
        if: steps.master-package.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .mg8/master-package
          key: ${{ steps.master-package.outputs.cache-primary-key }}

      - name: Build this tree's package (${{ matrix.lane }})
        timeout-minutes: 45
        run: |
          source scripts/ci_heartbeat.sh
          export NINJA_STATUS='[%f/%t elapsed=%es active=%r] '
          ccache --zero-stats
          if [ "${{ steps.lane.outputs.mpi }}" = "true" ]; then
            # The same configuration as the MPI lane, so that its ccache serves this build.
            cmake --preset ci-mpi \
              -DPOPS_NATIVE_DIM="${{ steps.lane.outputs.dimension }}" \
              -DPOPS_BUILD_PYTHON=ON \
              -DPOPS_USE_HDF5=ON \
              -DPython_EXECUTABLE="$(command -v python)"
            run_with_heartbeat "MG8 package ${{ matrix.lane }}" 40m \
              cmake --build --preset ci-mpi --parallel 2 --target _pops
            build_dir=build-mpi
          else
            # The same configuration as gate-python-build, so that its ccache serves this build.
            cmake --preset ci-kokkos-python -DCMAKE_LINKER_TYPE=MOLD \
              -DPOPS_NATIVE_DIM="${{ steps.lane.outputs.dimension }}" \
              -DPOPS_HEAVY_MODULE_TU_POOL=4 \
              -DPython_EXECUTABLE="$(command -v python)" \
              -DCMAKE_CXX_FLAGS="-ffile-prefix-map=${{ github.workspace }}=."
            run_with_heartbeat "MG8 package ${{ matrix.lane }}" 40m \
              cmake --build --preset ci-kokkos-python
            build_dir=build-kokkos-py
          fi
          mkdir -p .mg8/head-package
          cp -rL "$build_dir/python/pops" .mg8/head-package/pops
          ccache -s

      - name: Save ccache (MG8 ${{ matrix.lane }})
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CCACHE_CACHE_KEY }}

      - name: Run master's tutorials from master (${{ matrix.lane }})
        timeout-minutes: 45
        run: |
          set +e
          python3 scripts/run_mg8_tutorials.py run --phase reference \
            --source .mg8/master --lane "${{ matrix.lane }}" --python "$(command -v python)" \
            --pythonpath .mg8/master-package --include .mg8/master/include \
            --kokkos-root "$KOKKOS_PREFIX" --mpiexec "$(command -v mpiexec)" \
            --watchdog 2400 --output "$RUNNER_TEMP/mg8/reference"
          echo "reference exit $?"

      # Tutorial 14 runs to t = 8 on two ranks: this tree takes about four times master's time on
      # it (ROM-105), so it has a step and a budget of its own and cannot starve 03 to 08.
      - name: Run master's tutorials from this tree (${{ matrix.lane }})
        timeout-minutes: 45
        run: |
          set +e
          separate=()
          if [ "${{ matrix.lane }}" = "mpi-dim2" ]; then
            separate=(--exclude 14)
          fi
          python3 scripts/run_mg8_tutorials.py run --phase candidate \
            --source . --lane "${{ matrix.lane }}" --python "$(command -v python)" \
            --pythonpath .mg8/head-package --include include \
            --kokkos-root "$KOKKOS_PREFIX" --mpiexec "$(command -v mpiexec)" \
            --watchdog 2400 "${separate[@]}" --output "$RUNNER_TEMP/mg8/candidate"
          echo "candidate exit $?"

      - name: Run master's tutorial 14 from this tree (${{ matrix.lane }})
        if: matrix.lane == 'mpi-dim2'
        timeout-minutes: 60
        run: |
          set +e
          python3 scripts/run_mg8_tutorials.py run --phase candidate \
            --source . --lane "${{ matrix.lane }}" --python "$(command -v python)" \
            --pythonpath .mg8/head-package --include include \
            --kokkos-root "$KOKKOS_PREFIX" --mpiexec "$(command -v mpiexec)" \
            --watchdog 3300 --tutorial 14 --output "$RUNNER_TEMP/mg8/candidate"
          echo "candidate exit $?"

      - name: Compare with master (${{ matrix.lane }})
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          set +e
          python3 scripts/run_mg8_tutorials.py compare --lane "${{ matrix.lane }}" \
            --reference "$RUNNER_TEMP/mg8/reference" --candidate "$RUNNER_TEMP/mg8/candidate" \
            --verdict "$RUNNER_TEMP/mg8/verdict.json" --summary "$RUNNER_TEMP/mg8/summary.md"
          status=$?
          set -e
          if [ -f "$RUNNER_TEMP/mg8/summary.md" ]; then
            cat "$RUNNER_TEMP/mg8/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Publish the MG8 runs (${{ matrix.lane }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mg8-tutorials-${{ matrix.lane }}
          path: ${{ runner.temp }}/mg8/
          if-no-files-found: warn
          retention-days: 14
