name: Docs

# One deterministic documentation contract for pull requests and master.
on:
  push:
    branches: [master]
    paths:
      - '**.md'
      - 'docs/**'
      - 'scripts/build_docs.sh'
      - '.codespellrc'
      - '.markdownlint*'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'scripts/build_docs.sh'
      - '.codespellrc'
      - '.markdownlint*'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: documentation conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The documentation freshness check compares source and document history.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check documentation
        run: bash scripts/build_docs.sh
      - name: codespell (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python -m pip install codespell==2.4.2
          codespell docs examples benchmarks README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md
      - name: markdownlint (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: npx -y markdownlint-cli2@0.22.1
