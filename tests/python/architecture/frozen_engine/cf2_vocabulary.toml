# The refused vocabulary of CF2 (spec 0.3, CF2, section 15.3, FC2 to FC4; Linear N2, ROM-81).
#
# CF2 is a tripwire. It reads words, so it finds a name, not a formula coded without its name, which
# CF4 finds by swapping bodies; the evidence of G3 is CF1, CF3, CF4 and CF6.
#
# This file is the vocabulary, closed and versioned (review of 11/11, P8). scan.py reads it and
# holds no word of its own; the lists of CF2 and of section 15.3 summarize it. A word enters only
# with the finding that motivates it, written in `finding`: the site of b6 or the audit that showed
# the knowledge, or, for a name that section 15.3 lists and the tree does not hold, that fact. A
# file:line in a finding is at b6e64c1d (the early audit of N2 read a88d1ea, whose core is b6's);
# the counts of sites are those of cf2_exceptions.txt at 9f13dad.
#
# Rules of a change (test_cf2_vocabulary.py):
# - every change adds a [[versions]] entry whose `version` is one more than the last, whose
#   `digest` is the digest of the vocabulary as written (scan.vocabulary_digest()) and whose
#   `change` says what changed and why; `version` names the last entry;
# - a word added regenerates cf2_exceptions.txt with `refresh_exceptions cf2 --bootstrap`, and the
#   PR says why (MG6, refresh_exceptions.py); a word taken out, or a narrower rule, is a narrowing
#   that the PR declares in accepted_narrowings.txt, with its reason;
# - there is no exception for the name of a quadrature rule or of a base dimension: the core knows
#   pops.Quadrature and the base of the model only (D0, S3), and their names live in pops.lib.
#
# Sections: [[terms]] (a term is a word, or a phrase written with "-", each word optionally followed
# by an order or version number; "ident:" matches identifiers and paths, never strings; "core:" is
# refused in the core paths only, so that a qualified substitution of the native tree may name its
# generic algorithm, FC6); [[literals]] (string literals compared whole and case-sensitively);
# [[names]] (identifiers or strings compared whole and case-sensitively); [case_identifier];
# [axis_link] (a component name built from a name and an axis, found by the Python lexer);
# [[not_after]] (a term preceded by one of these words is another word).

version = 3

