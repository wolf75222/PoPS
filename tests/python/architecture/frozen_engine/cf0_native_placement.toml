# CF0 placement list (spec 0.3: CF0, FC6, FC6b, IR24, MG6; Linear N2), built from b6e64c1d.
#
# The natives of b6 that IR24 turns into qualified substitutions still sit in core paths. Each
# entry names one of them: its files, the issue and the phase that move it to the native component
# tree (cf0_paths.toml [native_tree]), and the interface of the closed list of FC6b
# (cf2_interfaces.toml) through which it will be bound. "lines" are the sites that IR24 cites (a line or
# a "first-last" range, in the first file); an entry without lines covers whole files.
#
# The list only shrinks (MG6): test_cf0_placement.py fails on an entry that b6 did not have, and on
# an entry whose files are no longer in core paths (moved or deleted), which must then be removed.
# It holds only Phase 2 entries at the exit of Phase 1 and is empty at the freeze (G01, FC8).

