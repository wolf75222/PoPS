  { case = "N17-chart-annulus", builder = "build_chart_annulus", structure = "2-D scalar Rusanov advection at the Cartesian velocity (1, 1/2) on the annulus written with sigma.chart and geometry=, outflow walls, uniform or graded radial nodes: the test of the charted surface of L2a" },
  { case = "N17-annulus-diffusion", builder = "build_annulus_diffusion", structure = "2-D scalar diffusion with one conductivity on every axis on the charted annulus, theta periodic, its walls held at the values 1 and 0: the end distances of a chart at a concave and a convex wall (L2b-1)" },
