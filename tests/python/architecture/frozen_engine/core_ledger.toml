# Core ledger (spec 0.3: FC7, A6, CF15, IR26, CF16).
#
# Every generic mechanism added to the core for the corpus is listed here with the two
# scientifically distinct structures that justify it (CF15): never one case, never the knowledge
# of one paper (A6). CF16 counts the entries against its target. An entry made before the first
# freeze has pre_freeze = true; the freeze (FC8) reruns the conformance suite over it.
#
# An entry names its issue, the rule that admits it, what it adds, the structures with the
# measurement that shows each one needs it, and the core paths it changes (CF0).

[[mechanism]]
id = "observed-face-residual-on-prepared-transport"
issue = "ROM-100"
rule = "IR26"
pre_freeze = true
what = """
A flux-only residual whose faces a Program observes, through the face carrier or through the
incident-face frequency of its stability guard, goes through the transport prepared at bind
whenever that transport can observe the block's faces: a periodic block, or a bounded block whose
physical faces it evaluates at the point with no omitted interface face (the native residual of a
Program that observes no face still prepares a boundary session per evaluation there). No boundary
session is then allocated per evaluation: a Program that reads only the frequency allocates per
accepted step what the native face allocates, and a Program that reads the faces still allocates,
per evaluation, the candidate and backup residuals of the capture path and copies the faces. The
face carrier is produced only when the Program reads it; otherwise the face gives only its
frequency, read from the face speeds that the evaluation recorded: on the prepared transport in the
traversal that already validates the evaluated residual, elsewhere in one pass. A partition
stability guard, emitted for a transport beside an independent diffusion, re-evaluates the residual
through evaluated_transport_frequency into a provisional field that it still allocates per call;
M01 and M03 emit none.
The generated face policy tests the finiteness of its outputs and of the operands whose non-finite
value an operation could conceal (comparison, fmin, fmax, sign, exp, expm1, pow, divisor); every
other operation carries a non-finite operand to an output, so the faces it refuses, and the cause
of each refusal, are those of a test of every evaluated value."""
structures = [
  { case = "M01", builder = "build_m01", structure = "2-D linear scalar transport, one component" },
  { case = "M03", builder = "build_m03", structure = "2-D stiffened-gas Euler, four components, nonlinear waves" },
]
measurement = """
benchmarks/n3a/face_routes.py at b6e64c1d (N3a, ROM-82): the riemann.User route reached 0.16 to
0.53 of native throughput on both structures, at 1 and 4 threads, with face kernels within 0.97 to
1.18 of native; the cost was a boundary session allocated and zero-filled per evaluation, an
unread copy of the faces and a two-pass frequency. After this mechanism, same script and machine
(ABBA, medians of six samples; 0.23 to 0.49 at the base 9b9bf65): 0.946 to 0.998 of native on M01
2048^2 and 4096^2 and on M03 1024^2 and 2048^2, at 1 and 4 threads, final states bitwise equal;
when the cells quadruple, the time per step grows x4.19 to x4.47 (native x4.23 to x4.41).
Kokkos allocations per accepted step (Kokkos Tools callbacks, independent review of #697 at
48d5dfe): on M01 and M03 at 64^2, 59 to 3 for the riemann.User route, the native count; on a block
with Outflow x faces (64x1 cells), 59 to 3 when the Program reads only the frequency and 63 to 15
when it reads the faces, where the native face of a Program that observes no face allocates 53."""
refusal_set = "unchanged: kUserNonFiniteFlux refuses the same faces with the same cause"
paths = [
  "include/pops/numerics/spatial/nd/face_frequency.hpp",
  "include/pops/runtime/builders/compiled/generated_amr_system_block.hpp",
  "include/pops/runtime/program/amr_program_context_diffusion.inc",
  "include/pops/runtime/program/prepared_scalar_boundary_session.hpp",
  "include/pops/runtime/program/program_context.hpp",
  "include/pops/runtime/system.hpp",
  "include/pops/runtime/system/system_block_closures.hpp",
  "python/pops/codegen/cpp_writer.py",
  "python/pops/codegen/program_emit_ops.py",
  "python/pops/codegen/user_riemann_lowering.py",
  "src/runtime/amr/amr_system.cpp",
  "src/runtime/system/system_program.cpp",
]

[[mechanism]]
id = "named-face-inputs-normal-and-signed-speeds"
issue = "ROM-99"
rule = "IR26"
pre_freeze = true
what = """
A riemann.User body or stability bound that names the parameter n or speeds after its five face
inputs receives the canonical normal of the face, or the signed interval (sL, sR) of the wave
speeds that the model declares along it, united over the two traces; one of the five inputs named
n or speeds is refused. The two inputs are one mechanism, the geometry of the face: the pair is
the signed speeds along n, and a body that states its own pair reads n to give it. The generated
face policy binds the normal of the native face context and evaluates the interval through the
model's signed-wave-speed interface, each only where an expression reads it: a face that reads
neither keeps its identity and its C++. A face that reads (sL, sR) reads it first, in the order of
the native two-wave face, and refuses a trace whose interval is not finite or not ordered before
its stability bound, its physical fluxes or its body are evaluated. It requires the model
capability wave_speeds. So that a case whose model declares no signed pair is refused when it is
validated, DiscretizationPlan.resolve_for calls the validate_model(model) of a rate method that
defines one, once the model is complete (wave speeds may be declared after Case.numerics);
FiniteVolume.validate_model is its only user. A package lowered from such a model is refused again
before any C++ is generated."""
structures = [
  { case = "M03", builder = "build_m03", structure = "2-D stiffened-gas Euler, four components, signed waves v.n - c and v.n + c" },
  { case = "M16", builder = "build_m16", structure = "2-D HyQMOM15 B.1 fifteen moments, signed waves from the flux Jacobian, no closed form" },
]
measurement = """
Before (b155d8b, N3a, tests/python/unit/numerics/test_lib_numerics_faces.py): riemann.User refused
the CF15 graph, a body or a bound that reads n, and on M03 and M16, at each case's initial state,
sL < 0 < sR on every cell, sL + sR is not zero and the pair differs between the two normals, so
no function of the spectral radius s gives it. After: the graph builds, and the derived
hll(F, Uh) of pops.lib.numerics, without speeds=, takes the same steps as riemann.HLL() with
bitwise equal final states, L1 = Linf = 0, on M03 (16 x 8 cells, 2 steps) and on M16 (16 x 16
cells, 4 steps) (tests/python/integration/runtime/test_api_v02_python_faces_native.py). The normal,
on M01 (16 x 8 cells, 2 steps, a = (.7, .3)): rusanov(F, Uh, smax) with smax(uL, uR, n) = |a.n|
and upwind(F, Uh, speed) with speed(face) = a.face.normal take the steps of riemann.Rusanov() with
bitwise equal final states, L1 = Linf = 0; the upwind face sees a sign error of n, the Rusanov
face an exchange of its axes.
The interval: on M01 with the declared pair (a + 1, a), not ordered while waves= stays valid, the
derived face refuses the step and publishes nothing, as riemann.HLL() does; on M16's nonreal
oblique spectrum it refuses the step as the native face does
(tests/python/integration/runtime/test_api_v02_python_face_inputs_native.py; gcc 13, Kokkos 4.4.1
Serial)."""
refusal_set = "added: a face that reads (sL, sR) on a model that declares no signed pair, at validation; a body or a bound that names n or speeds among its five face inputs, at authoring; unchanged for every other face"
paths = [
  "python/pops/codegen/user_riemann_lowering.py",
  "python/pops/numerics/plan.py",
  "python/pops/numerics/riemann/user.py",
  "python/pops/numerics/spatial.py",
]

[[mechanism]]
id = "face-frequency-rule-of-the-step-strategy"
issue = "ROM-107"
rule = "IR26"
pre_freeze = true
what = """
The frequency that the stability guard of a riemann.User face reads from the face speeds that its
evaluation recorded has a rule, named by the step strategy of the Program
(StepStrategy.face_frequency_rule) and passed to the observing residual by the generated Program:
incident_sum, sum_a s_a / h_a, the default and the only rule before, or largest_axis,
max_a s_a / min_a h_a, the rule by which a step bound of the form c min_a h_a / max_a s_a (2.6.9)
admits its own step. The prepared group transport and the standalone observation reduce the same
recorded speeds by either rule, in the traversal that already validates the residual; the core
names neither strategy. The combined transport-diffusion certificate and every Program without
such a strategy keep the incident sum and the code they had."""
structures = [
  { case = "M01", builder = "build_m01", structure = "2-D linear scalar transport, one component" },
  { case = "M03", builder = "build_m03", structure = "2-D stiffened-gas Euler, four components, nonlinear waves" },
]
measurement = """
benchmarks/n3/rom107_adaptive_faces.py (16 x 8 cells, the builders' two SSPRK2 stages under
AdaptiveCFL(cfl=0.45) to 200 builder steps; gcc 13, Kokkos 4.4.1 Serial, one cloud container).
With the incident sum (the guard of the base), the Python rusanov face is refused at its first
attempt on both structures (reason 503, user_face_numerical_stability) while the native face takes
16 steps on M01 and 15 on M03. With the strategy's rule, the Python face takes the same 16 and 15
steps to the same clock, final states bitwise equal (L1 = Linf = 0). Master's scalar-advection
tutorial 02 as written (64 x 64, MUSCL(VanLeer), inflow and outflow): upwind(speed=) takes the
native ScalarUpwind's steps, Linf 7.9e-15
(tests/python/integration/runtime/test_lib_face_body_swap_native.py)."""
refusal_set = "removed: the first-step refusal of a riemann.User face under AdaptiveCFL where the face speeds equal the proposal's; unchanged under every other strategy and for the combined transport-diffusion certificate"
paths = [
  "include/pops/numerics/spatial/nd/face_frequency.hpp",
  "include/pops/numerics/spatial/nd/face_frequency_rule.hpp",
  "include/pops/runtime/program/amr_program_context_diffusion.inc",
  "include/pops/runtime/program/program_context.hpp",
  "include/pops/runtime/system.hpp",
  "python/pops/codegen/program_emit_ops.py",
  "python/pops/codegen/program_partition_stability.py",
