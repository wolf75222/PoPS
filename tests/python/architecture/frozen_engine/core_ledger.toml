  { case = "N17-chart-diffusion", builder = "build_chart_diffusion", structure = "2-D scalar two_point() diffusion of -k grad(u) on the doubly periodic unit square under a chart, turned by pi / 6 (K-orthogonal) or sheared x = s + t / 4 (sine 1 / sqrt(17)), written with sigma.chart: the stencil of a chart at the surface (L2b-1)" },
