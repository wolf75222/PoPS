[[mechanism]]
id = "stencil-body-reads-a-runtime-parameter-of-its-model"
issue = "ROM-87"
rule = "IR26"
pre_freeze = true
what = """
The body of a StencilFlux may read a RuntimeParam of a model, as the body of a riemann.User face
already does (codegen/user_riemann_lowering.py): the Program accepts the read only when the
parameter is a RuntimeParam declared by the model of the block of the state that the stencil reads
(BlockHandle.accepts) and refuses any other by its name; the generated face binds the block's
table, ctx.program_params(block), once per evaluation on the host, captured by value into the face
closure, and reads params.get(i) with the model's stable index; the bind routing
(program_param_entries) lists the stencil as a reader of that table. The value is bind data: two
values give the same artifact hash and the same C++. A parameter that no formula of the model
reads has no slot in the table and is refused by its name. Every stencil that reads no runtime
parameter keeps the code it had."""
structures = [
  { case = "M05", builder = "build_m05", structure = "2-D compressible Navier-Stokes, viscous face stencil, four components" },
  { case = "M23", builder = "build_m23", structure = "2-D Hall MHD, face stencil of the Hall and ohmic terms, eight components" },
]
measurement = """
On d06bb2c, the coefficient of each stencil is a Python float folded into its body: build_m05
with viscosity 0.01 and 0.02, and build_m23 with hall 0.1 and 0.2, resolve to different artifact
hashes, so every value is a new compile; read as a runtime parameter, it is one artifact. The
surface needs it: L1 of §17.1 writes nu as model.parameter with Positive(), and once upwind() is a
riemann.User body, two_point() is realized by a StencilFlux beside it (the native Diffusion beside
a riemann.User face is refused by b6), so without the read L1 has no realization
(n3/question_kappa_parametre.md). tests/python/unit/numerics/test_stencil_runtime_parameter.py:
two defaults of nu give the same artifact hash and C++; the native run of one artifact bound with
nu = 0.01 and 0.05 gives each its own step, to 1e-13 of the closed form
(tests/python/integration/runtime/test_stencil_runtime_parameter_native.py)."""
refusal_set = "removed: the refusal of a RuntimeParamRef in a stencil body ('stencil body contains an unsupported scalar operation') for a RuntimeParam of the block's own model read by one of its formulas; added: a parameter of another model, a non-runtime parameter, or one that no formula of the model reads, each refused by its name"
paths = [
  "python/pops/codegen/program_emit_ops.py",
  "python/pops/codegen/program_emit_params.py",
  "python/pops/codegen/program_emit_stencil_flux.py",
  "python/pops/model/stencil_expression.py",
  "python/pops/time/_program/stencil_flux.py",
]

[[mechanism]]
id = "state-operand-of-a-matrix-free-operator"
issue = "ROM-90"
rule = "IR26"
pre_freeze = true
what = """
A matrix_free_operator of domain and range "state" may record its apply on State placeholders of
the unknown's block, with the State's state_ref, instead of scalar fields (set_apply,
time/_program/local.py). The apply then evaluates the model's own rates at its operand: the -div_h
of a StencilFlux, with the runtime parameters that its body reads (core commit 2f44e80f). Only a
reference realization (SV9) applies such an operator, inside its region, through the same authoring
body. The operator is linear in its operand: a nonlinear face enters through its frozen-coefficient
linearization, every factor that is not linear in the iterate read from a frozen state through the
StencilFlux's field inputs; the entry claims no symmetry or definiteness. The apply block is a
declaration that the accepted decomposition (rule linear_solve), the identity and pops.inspect
read; no C++ lambda is emitted from it. Its native realization is the operator generated by G10,
and until G10 a native solve of such an operator is refused by that name. No structure of the
corpus solves with it yet: the first case that does is L1-d of section 17.1, a litmus case, and the
first corpus structure comes with G10. Every operator recorded on scalar fields keeps the code it
had."""
structures = [
  { case = "M05", builder = "build_m05", structure = "2-D compressible Navier-Stokes, frozen-coefficient linearization of the viscous and conductive face stencil, four components" },
  { case = "M23", builder = "build_m23", structure = "2-D Hall MHD, frozen-coefficient linearization of the Hall and ohmic face stencil, eight components" },
]
measurement = """
The need is the stiff part of a face stencil, which an implicit solve applies at a State. build_m05's
viscous face reports the frequency 2((4/3) mu + k/cv) / (rho h^2) (navier_stokes_face), and
build_m23 caps its step at 0.01 / (cells^2 (hall + ohmic + 0.01)): both steps shrink as h^2. Both
faces are nonlinear in the state (1/rho, the viscous work, J x B / (n e)), so an implicit solve
applies their frozen-coefficient linearization, which is linear in the iterate and general (no SPD
claim). A scalar-field apply cannot evaluate either stencil: it has no state_ref, no ghosts of the
block and no parameter table. The case that needs the mechanism now is L1-d of section 17.1, with nu a
model.parameter, solved by cg() (n9/relation_solves/lot_note.md, probes P1 and P2: 50 steps equal
to the native realization within 4.4e-16; one artifact bound with nu = 0.01 and 0.05, each equal to
its constant build and within 1.1e-15 of a dense solve).
tests/python/integration/runtime/test_state_operand_n9_native.py records the frozen-coefficient
stencils of build_m05 and build_m23 on a State operand with general properties, lowers each inside
a reference region, and checks one evaluation against the explicit face at the frozen state (on an
8x8 grid, within 64 ulps of max|W| over the explicit step; observed 1.1e-11 relative for M05 and
9.1e-11 for M23); it solves with neither."""
refusal_set = "added: the native solve of a State-operand matrix_free_operator, refused naming the operator generated by G10; a rate that is not region-safe in a State-operand apply, refused by its name; removed: nothing"
paths = [
  "python/pops/codegen/program_emit_ops.py",
  "python/pops/surface/_solver.py",
  "python/pops/time/_program/local.py",
  "python/pops/time/_program/solve.py",
  "python/pops/time/solve_outcome.py",
]

