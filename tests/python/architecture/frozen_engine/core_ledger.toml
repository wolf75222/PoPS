[[mechanism]]
id = "static-geometry-arrays-of-a-structured-configuration"
issue = "ROM-110"
rule = "IR26"
pre_freeze = true
what = """
A layout whose coordinate map reads neither the clock nor a discrete input is served by the static
geometry arrays of its configuration, the zero-velocity case of the geometry-evolution contract
(D0b, D18, D21), whose one provider before was the moving interval of rank one. A map whose
component a reads the logical coordinate a alone is read as node positions with exact node
differences, at ranks one to three (a graded box); any other map is a chart, of rank two, whose
measures and face integrals take the rule that the layout states (D0b). At bind the System
generates the arrays once, the same on every rank, from the analytic programs of the map evaluated
with their forward-mode derivatives by the native interpreter: cell measures and centroids; face
area vectors, measures, unit normals and centroids; distances across faces (across the seam of a
periodic axis with its translation); widths. It refuses them collectively unless their certificates
hold (finite and positive measures, det DX > 0 at every rule point, every cell closed to 8 eps sum
|S|, the seams identified). The generated faces of a block compiled for such a layout read the
physical unit normal and the face measure of the arrays, F.n = sum_k n_k F_k with the bound sum_k
|n_k| rho(A_k), and the cell measure of the arrays in place of the products of spacings; the
prepared diffusion of a Program reads their distances, face measures and cell measures. The
consumers it serves are stated as capability rules at resolution, never by method name (CF2): face
laws whose requirements are the normal flux, the provider pack and the stability bound, traces of
formal order one, boundaries that extend the interior state, the two-point diffusion of one
component with a diagonal coefficient on node positions of any rank, the reductions that a block
owns with the finite assessment of an Advance, FixedDt and bound initial values. On a box nothing
is materialized and the generated code is unchanged. L1b serves node positions of rank three, whose
faces are faces of a box (the logical axis times the product of the node differences of the other
axes), and the graded surface: pops.Graded(base=, nodes=) elaborates to this static case; its
logical nodes are lower + (upper - lower) (k / c) with k / c correctly rounded, so that graded
nodes nest bitwise across resolutions; the end nodes of node positions keep the bounds of their box
(within 4 ulp, then set to them); and the two copies of a seam face share their distance. The
renormalization of child measures at regrid is L4, with the transfers of G11; G03 extends the same
entry per interval. After N3 lot 1 the words of pops.lib.numerics are schemes authored in source,
and L1b serves them on the arrays: a riemann.User face (rusanov(), upwind()) reads the cell values
as its traces and the physical unit normal of the arrays as n, on node positions and on a chart,
and the step guard of such a face weighs each face bound by the measure of the face over the
measure of the cell; a StencilFlux (two_point()) on node positions reads, on the faces of axis a,
the two cells of the face and the distance across it as its spacing along a, integrates over the
face measure, divides by the cell measure, and turns the incident frequency f of a face into the
conductance f d |S| that each cell sums over |K|, which is f unchanged on a box. L2a writes the
chart at the surface: sigma.chart(x=e_x, y=e_y) on a support of rank two, its keywords the frame
axes and the coordinates of sigma its logical axes (S6), elaborates with the rule that
pops.Uniform(geometry=) states to this static case, a graded chart composing its node functions with
the chart; on a physical normal the face input s of a face authored in source is the bound
sum_k |n_k| rho(A_k), which rusanov() reads as its spectral radius (DN31). L2b-1 serves the
two-point face on a chart: at a physical end the arrays of a chart state the mirrored distance
2 |m_f - c_K| under the certificate of node positions, where they stated NaN; they publish the
largest sine between the normal of a face and the line of the two centroids that it separates,
measured and not required (DN36); and the stencil of a StencilFlux and the prepared diffusion of a
Program are served on a chart when their law is one law on every logical axis (rows equal once the
two cells and the spacing of their axis are renamed, one coefficient on every axis), which reads
the normal through n.n = 1 alone, so that the row of the axis normal is the flux density along the
physical normal (DN35)."""
structures = [
  { case = "N17-annulus", builder = "build_annulus_free_stream", structure = "2-D isothermal Euler, a vector balance in Cartesian components on a charted annulus, theta periodic" },
  { case = "N17-graded", builder = "build_graded_diffusion", structure = "1-D scalar diffusion with no-flux ends on graded nodes x = tanh(3 s) / tanh(3)" },
