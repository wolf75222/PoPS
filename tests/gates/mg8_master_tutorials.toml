[[tutorial]]
id = "15"
script = "15_openmp_convergence.py"
lane = "serial-dim2"
outputs = [
  { pattern = "results/15_openmp_convergence.npz", kind = "npz" },
  { pattern = "figures/scalar_advection_convergence.png", kind = "bytes" },
]

[[tutorial]]
id = "16"
script = "16_openmp_cartesian3d_ssprk2.py"
lane = "serial-dim3"
outputs = [{ pattern = "results/16_openmp_cartesian3d_ssprk2.npz", kind = "npz" }]

# Causes of the divergences of this tree from master: each names the commits that introduced it
# (check --verify-commits proves that each is in the history and changes code that the tutorials
# execute), the issue that owns it and the evidence that attributes it. The attribution build is
# b6 with master's semantics for the four causes that MG8-1 found
# (variant_b6_with_master_semantics.patch, replicas and traces in
# /mnt/project-files/landing/mg8): each divergence names the run of that build that reproduces
# master bit for bit, printed and console lines included.

[[cause]]
id = "inflow-face-trace"
commits = ["6603aec4"]
issue = "ROM-101"
text = '''
b6 imposes the value of Inflow(value=g) as the exterior Riemann trace of the boundary face
(PrescribedFaceTrace, prepared_hyperbolic_boundary.hpp); master, like dirichlet_ghost of D9,
reconstructs that trace by MUSCL from the mirrored ghost cells 2g-u, so the upwind flux of an
inflow face differs wherever the interior is not affine next to it.
'''
evidence = '''
A NumPy replica of the uniform tutorials with each trace reproduces the final states of master
and of b6 within 5e-14 and their difference (up to 2.5e-5) within 1.1e-15 (01, 11, 15, 16). The
attribution build reproduces master bit for bit (see above).
'''

[[cause]]
id = "amr-tag-selection"
commits = ["8f972aa1", "a17fe0e9"]
issue = "ROM-103"
text = '''
pops.amr.tag-selection@1: b6 dilates only the accepted Refine tags, by the authored Buffer
alone; master dilated every cell of the target coverage, retained cells included, by the
transition buffer max(Buffer, derived) plus the lookahead, and nested the clustering by the
transition buffer. The fine patches differ from the bind on, and with them the console line at
step 10 of 05, 07 and 12.
'''
evidence = '''
At bind, before any step, tutorial 05 refines coarse cells [3..15]x[5..17] on master and
[4..14]x[6..16] on b6: the cells above 0.30, [6..12]x[8..14], dilated by 3 and by 2. The
attribution build reproduces master bit for bit (see above).
'''

[[cause]]
id = "regrid-boundary-prolongation"
commits = ["72d3d077"]
issue = "ROM-104"
text = '''
At a regrid, b6 fills a new fine cell whose parent touches a non-periodic face of the domain
with the one-sided interior difference of the parent, unlimited
(prepare_physical_boundary_prolongation in prepare_regridded_state_transfer); master, like
linear_prolongation of section 2.6.9, takes the MC slope over both neighbours, the boundary
ghost cell included. Only fine patches that reach the domain boundary see it.
'''
evidence = '''
Tutorial 09 on b6 built with the three other semantics of master: same hierarchy at every step
and same bits up to the regrid of step 2, whose 84 new fine cells next to y_min differ (at most
2.5e-6); each rule, replayed in NumPy in the order of the kernel, gives the 84 values of its
version bit for bit. The attribution build reproduces master bit for bit (see above).
'''

# One divergence per tutorial: the exact checks that differ, their causes and their attribution,
# "reproduced" with the verdict of the run of the attribution build that gives master's bits
# (under /mnt/project-files), or "inferred".
# compare fails on a difference without an entry and on a check that no longer differs, and check
# --check-base on an entry that the base does not have, so this list only shrinks (MG6); a failure
# is never a divergence (CF14).

[[divergence]]
tutorial = "01"
causes = ["inflow-face-trace"]
attribution = "reproduced"
reproduction = "review/pr701/runs/serial-dim2/verdict-variant-vs-master.json (sha256 ab877d48)"
checks = [
  "run0:rank0:run0-tracer:sha256",
  "monitor:rank0",
  "output:results/01_openmp_preset_ssprk2.npz:results/01_openmp_preset_ssprk2.npz",
]

