schema_version = 1
gate = "mg9-bridges"
# MG9 (spec 0.3, section 18.2): each word of pops.lib written with a b6 signature is ported once,
# and its earlier signature is removed in the same slice (SU3). A word that returns a native route
# without a Python body is a bridge: [[bridge]] lists it with the route that it returns and the
# ticket and lot that remove it. [[earlier]] lists each module of pops.lib still written with a b6
# signature, its words and its owner. Both lists only shrink (MG6): scripts/mg9_bridges.py check
# --check-base fails when this file records more than the base does. [[bridge]] is empty at the
# exit of phase 1 (OD29; OD31, condition S6 of the vertical slice), [[earlier]] before MG10.
#
# Every other module of pops.lib is a module of the surface (it imports pops.surface, or no module
# of pops, like the writers of pops.lib.output, and passes the lint SU-T1, SD94), a module that only
# a [[bridge]] holds, or a package that only re-exports its submodules.
# tests/python/architecture/test_mg9_bridges.py checks this file against the tree, and the lint
# SU-T1 (test_su_t1_surface_lint.py) reads its exceptions here.
#
# N3 lot 1 (ROM-87): upwind(), rusanov(), hll() and two_point() are bodies of @pops.scheme in
# pops.lib.numerics.fluxes, and pops.lib.numerics.schemes, which returned riemann.Rusanov(),
# riemann.HLL() and Diffusion(flux=F^d), is gone: no word of N3 is a bridge.
#
# cg() of the N15 lot « solves » (#776), with the conditions of the pilot's ruling (driver, 12/11):
# the bridge carries the refusal of a model.parameter coefficient, which names it, and the test
# that removes it runs L1-d of §17.1 with nu a model.parameter. Its matrix-free apply of the
# two_point() diffusion sits beside it in pops.lib.solve (N3 lot 1, D7). The N9 lot « La référence
# sous les solves de relation » removes the entry before the exit of phase 1.
[[bridge]]
word = "cg"
module = "pops.lib.solve"
route = "pops.solvers.CG"
owner = "N9, the lot « La référence sous les solves de relation »: the reference CG of pops.lib.solve with the operator generated by G10, before the exit of phase 1"
refusal = "tests/python/unit/surface/test_su_t2_solve_refusals.py::test_a_coefficient_that_is_a_parameter_names_the_bridge_that_reads_it"
exit_test = "L1-d of §17.1 with nu = model.parameter('nu', admissible=pops.Positive()) solved through cg(), the step bound with two values of nu"

# The ghost laws of the boundary policy ghosts() (N15 lot B, #774): the elaborator adds to the block
# the b6 Inflow (2 g - u_k) or Outflow (u_1) that the body of the policy states. The module holds
# only that bridge; G04 removes it when it generates the ghost fills from the body.
[[bridge]]
word = "realize"
module = "pops.lib.numerics.ghost_laws"
route = "pops.boundary.transport.Inflow, pops.boundary.transport.Outflow"
owner = "G04, the ghost fills generated from the body of the boundary policy (N15)"

# The step rule cfl_limit() of N15 lot D-E, part D (#788), accepted as a bridge by the pilot's
# ruling (driver, 12/11) and counted in the exit list of phase 1: its value subclasses the
# surface's StepRuleValue and realizes N8's compiled StepRule paired with b6's AdaptiveCFL of the
# same fraction and cap. The bridge carries the refusal of dt= as a function of cell; N8 removes
# the entry when it elaborates dt= as a function of cell (the step rules of 5.11 written with the
# surface, 2.6.9), and cfl_limit is then written with the surface.
[[bridge]]
word = "cfl_limit"
module = "pops.lib.time.limits"
route = "pops.time.AdaptiveCFL, through the compiled StepRule of N8 (StepRuleValue)"
owner = "N8, which elaborates dt= as a function of cell (the step rules of 5.11 written with the surface), before the exit of phase 1"
refusal = "tests/python/unit/surface/test_lot_d_step_rule.py::test_a_function_of_cell_is_still_a_later_step_rule"
exit_test = "the slice's case with dt= a function of cell written with the surface, against the steps of cfl_limit(advection, cfl=0.45, max_dt=1e-2) under Simulation.run"

[[earlier]]
modules = ["pops.lib.numerics.face_flux"]
words = ["FaceFlux", "RealizedFaceFlux", "realize_face_flux"]
# O2 of the lot note of N3: the package pops.lib.numerics no longer re-exports them; a case writes
# pops.surface.discrete.FaceFlux.
owner = "N7, the FaceFlux of the N7a pilot"

