schema_version = 2
gate = "m2-temporal-execution"
issues = ["ADC-648", "ADC-661", "ADC-662", "ADC-663", "ADC-664", "ADC-665", "ADC-666", "ADC-667", "ADC-668", "ADC-700"]

# These are acceptance gaps, not waivers.  The default runner fails closed while
# any row remains; --available-only runs the supporting proofs below.
[[deferred]]
requirement = "normalized_program_execution"
blocked_by = ["ADC-668"]
missing = "Graph identity is proved, but mandatory native manual and preset SSPRK2 plus IMEX execution still needs one stable executable acceptance."

[[deferred]]
requirement = "native_solve_outcome_fault_matrix"
blocked_by = ["ADC-665"]
missing = "Every local, global and field solve publication boundary needs native singular, breakdown, iteration-limit and invalid-evaluation injection."

[[deferred]]
requirement = "atomic_rejection_side_effects"
blocked_by = ["ADC-666"]
missing = "One fault matrix must reject after stage, solve, synchronization, guard and effect preparation without state, history, cursor, output or checkpoint leakage."

[[deferred]]
requirement = "strict_temporal_continuation"
blocked_by = ["ADC-667"]
missing = "A strict restart must reproduce the exact next attempt with histories, off-schedule caches, controllers and event cursors."

[[deferred]]
requirement = "native_multiblock_implicit_phase"
blocked_by = ["ADC-665", "ADC-666"]
missing = "A real native multi-block implicit fixture must use each block operator and consume one declared solve phase transactionally."

[[deferred]]
requirement = "refined_hierarchy_native_ordering"
blocked_by = ["ADC-648"]
missing = "A refined two- or three-level native oracle must prove gather all levels, solve once, publish or reconstruct, guard, then commit."

[[deferred]]
requirement = "legacy_temporal_route_retirement"
blocked_by = ["ADC-700"]
missing = "The negative gate must prove no legacy stepper, fallback publication path, ignored outcome or compatibility alias remains."

