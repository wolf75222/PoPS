schema_version = 1
gate = "ir5-private-lists"
# IR5 (spec 0.3): « No construct has a private list of admitted operations ». Every Program
# operation has one row in the effect table, python/pops/_ir/effects.py (G02 lot L, design note
# §5.1); region safety, device placement and the GraphFunction effect words are read from it.
#
# [[list]] names each module-level set literal of three or more names that all have a row in the
# effect table and that still stands in python/pops, with what it is, its owner and the lot that
# removes it. tests/python/architecture/test_ir5_private_lists.py checks this file against the tree
# in both directions: an unlisted set fails, and so does an entry whose set is gone, so the entry
# leaves with its set. The list only shrinks: a new set of operation names is a row of the effect
# table, not a new entry here.
#
# kind = "dispatch": the operations that one emitter or authoring module defines and lowers; it
# chooses code, not admission. kind = "structural": how a value relates to its inputs (IR19's
# typed delivery). kind = "admission": a private list of admitted operations, the counter-example
# of IR5. At the end of G02 lot L no list owned by G02 remains: the ten effect lists of the note's
# gap E5 are rows of the effect table. The unary dictionary of fields/spatial_interaction.py maps
# expression node classes, not operation names, and goes with lot P, which owns the table of
# elementary functions (§9).

