# Optional Pixi environment; no lockfile is shipped. Keep dependencies aligned
# with environment.yml. Select POPS_NATIVE_DIM=1, 2 or 3 before building.

[project]
name = "pops"
description = "Outillage de build et backends CPU locaux d'PoPS"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
python = "3.12.*"
cmake = ">=3.27"
ninja = "*"
ccache = "*"
scikit-build-core = ">=0.10"
pip = "*"
fftw = "*"
numpy = ">=1.24"
pybind11 = ">=2.13,<3"
kokkos = "*"        # Serial-only sur conda-forge ; multi-thread reel : pixi run kokkos-openmp
mpich = "4.1.2.*"   # aligne sur le MPICH embarque par ParaView 6.1.1
mpi = { version = "1.0.*", build = "mpich" }
hdf5 = { version = "1.14.3.*", build = "mpi_mpich_*" }
llvm-openmp = "*"

# Toolchain C++23 par plateforme : gcc conda sur Linux (active CC/CXX a l'activation) ;
# sur macOS on garde AppleClang (le clang conda est un LLVM vanilla, mesure >15x plus lent
# sur les TU du module ; cf. hint du configure).
[target.linux-64.dependencies]
cxx-compiler = "*"

[target.linux-aarch64.dependencies]
cxx-compiler = "*"

[tasks]
# Module Python serie, installe dans l'env pixi (sans PYTHONPATH).
build-py = "python -m pip install . --no-build-isolation"
# Module parallele : Kokkos OpenMP requis (tache kokkos-openmp d'abord si le kokkos conda est Serial).
build-py-kokkos = { cmd = "python -m pip install . --no-build-isolation -v", env = { POPS_USE_KOKKOS = "ON", Kokkos_ROOT = "$CONDA_PREFIX" } }
# Kokkos Serial+OpenMP compile dans l'env (~2 min) -- comble le kokkos conda Serial-only.
kokkos-openmp = "bash scripts/kokkos_openmp_conda.sh"
# Coeur + tests C++ (presets ; l'env pixi expose CONDA_PREFIX comme conda).
test = "cmake --preset serial && cmake --build --preset serial && ctest --preset serial"
docs = "bash scripts/build_docs.sh"
doctor = "python -c 'import os; from pops._native_selector import select_native_dimension; select_native_dimension(int(os.environ[\"POPS_NATIVE_DIM\"])); from pops.runtime.doctor import doctor; doctor()'"
