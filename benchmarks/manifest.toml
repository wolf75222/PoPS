schema_version = 1

[harness]
cmake_source = "benchmarks"
target = "pops_benchmark"
executable = "bin/pops_benchmark"
output_schema = "pops.benchmark.v1"

[protocol]
clock = "steady_clock"
device_fence = "before_and_after"
mpi_barrier = "before_and_after"
rank_aggregation = "max"
numerical_validation = "outside_timed_region"
absolute_time_thresholds = false
default_warmups = 2
default_repetitions = 7

[[case]]
id = "arith_halo"
implementation = "real PoPS MultiFab saxpy/lincomb followed by periodic fill_boundary"
comparison = "paired ABBA: saxpy_then_fill_boundary over lincomb_then_fill_boundary"
records = ["saxpy_then_fill_boundary", "lincomb_then_fill_boundary", "saxpy_over_lincomb"]

[case.defaults]
n = 1024
tile = 128
components = 4
ghost_width = 1

[[case]]
id = "tensor_krylov"
implementation = "real PoPS prepared generic BiCGStab with a persistent GeometricMG preconditioner"
comparison = "none"
records = ["bicgstab_geometric_mg"]

[case.defaults]
n = 128
tile = 64
max_iters = 300
rel_tol = 1e-9
abs_tol = 0.0

[profiles.romeo_armgpu]
account = "r250127"
constraint = "armgpu"
default_work_root = "/scratch_p/$USER/$SLURM_JOB_ID"
default_results_root = "$HOME/pops-benchmark-results"
job_script = "benchmarks/romeo/job_armgpu.sbatch"
submit_script = "benchmarks/romeo/submit_armgpu.sh"

[campaigns.adc700_program_cutover]
routine_ci = false
source = "benchmarks/adc700"
baseline_revision = "db3d390f43dfb14f12e88db31a9b3e631ff50488"
candidate_revision = "35203a76957cdfe1491e237d714f452a50a266ff"
measurement_schema = "pops.adc700.program_cutover.measurement.v1"
report_schema = "pops.adc700.program_cutover.report.v1"
protocol = "paired_ABBA"
metric = "candidate_throughput_over_pre_cutover"
minimum_ratio = 0.98
requires_real_device = true
requires_distinct_device_per_rank = true
job_script = "benchmarks/romeo/adc700_program_cutover.sbatch"
submit_script = "benchmarks/romeo/submit_adc700_program_cutover.sh"

[campaigns.adc757_heterogeneous_numerics]
routine_ci = false
source = "benchmarks/adc757"
report_schema = "pops.adc757.heterogeneous-numerics.v1"
verifier = "benchmarks/adc757/verify.py"
requires_real_device = true
requires_distinct_device_per_rank = true
minimum_mpi_ranks = 2
minimum_streams = 2
requires_stream_overlap = true
requires_restart_rollback_and_ledger_parity = true
scenarios = ["prepared_local_time", "cost_aware_load_balance"]
metrics = [
  "time_to_solution_seconds",
  "throughput_cell_updates_per_second",
  "memory_traffic_bytes",
  "kernel_launches",
  "task_count",
  "communication_bytes",
  "communication_seconds",
  "fallback_count",
  "useful_work_cell_updates",
  "imbalance_ratio",
  "migration_bytes",
  "migration_seconds",
]
