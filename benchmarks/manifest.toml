schema_version = 1

[harness]
cmake_source = "benchmarks"
target = "pops_benchmark"
executable = "bin/pops_benchmark"
output_schema = "pops.benchmark.v1"

[protocol]
clock = "steady_clock"
device_fence = "before_and_after"
mpi_barrier = "before_and_after"
rank_aggregation = "max"
numerical_validation = "outside_timed_region"
absolute_time_thresholds = false
default_warmups = 2
default_repetitions = 7

[[case]]
id = "arith_halo"
implementation = "real PoPS MultiFab saxpy/lincomb followed by periodic fill_boundary"
comparison = "paired ABBA: saxpy_then_fill_boundary over lincomb_then_fill_boundary"
records = ["saxpy_then_fill_boundary", "lincomb_then_fill_boundary", "saxpy_over_lincomb"]

[case.defaults]
n = 128
tile = 128
components = 4
ghost_width = 1

[[case]]
id = "scalar_mg"
implementation = "real exact-ranked PoPS GeometricMG with a manufactured Dirichlet solution"
comparison = "none"
records = ["geometric_multigrid"]

[case.defaults]
n = 64
tile = 32
max_cycles = 100
rel_tol = 1e-9
abs_tol = 0.0

[profiles.romeo_armgpu]
account = "r250127"
constraint = "armgpu"
default_work_root = "/scratch_p/$USER/$SLURM_JOB_ID"
default_results_root = "$HOME/pops-benchmark-results"
job_script = "benchmarks/romeo/job_armgpu.sbatch"
submit_script = "benchmarks/romeo/submit_armgpu.sh"

[campaigns.adc700_program_cutover]
routine_ci = false
source = "benchmarks/adc700"
baseline_revision = "db3d390f43dfb14f12e88db31a9b3e631ff50488"
candidate_revision = "HEAD"
measurement_schema = "pops.adc700.program_cutover.measurement.v1"
report_schema = "pops.adc700.program_cutover.report.v1"
protocol = "paired_ABBA"
minimum_abba_blocks = 5
metric = "candidate_throughput_over_pre_cutover"
minimum_ratio = 0.98
requires_real_device = true
requires_distinct_device_per_rank = true
minimum_mpi_ranks = 4
minimum_gpu_count = 4
requires_mpi_communicator = "MPI_COMM_WORLD"
requires_per_run_gpu_uuid = true
requires_immutable_archive = true
requires_archived_tree_receipt = true
requires_archive_receipt_before_each_run = true
requires_immutable_toolchain_receipt = true
requires_cmake_target_toolchain_probe = true
requires_exact_baseline_candidate_toolchain = true
requires_baseline_toolchain_build_attestation = true
baseline_cxx_standard = 20
patch_layout_distribute_coarse = true
patch_layout_coarse_max_grid = "n/2"
requires_authenticated_coarse_boxes = true
driver = "benchmarks/adc700/program_cutover.py"
verifier = "benchmarks/adc700/verify.py"
requires_compiled_program_module = true
requires_extension_provenance = true
requires_installed_wheel_proof = true
wheel_proof_schema_version = 3
requires_zero_allocation_after_prepare = true
dispatch_complexity = "O(operations*levels), never O(cells)"
probe_resolutions = [16, 32]
probes = ["uniform", "amr_refined_planned"]
requires_authenticated_report = true
job_script = "benchmarks/romeo/adc700_program_cutover.sbatch"
submit_script = "benchmarks/romeo/submit_adc700_program_cutover.sh"

[campaigns.adc757_heterogeneous_numerics]
routine_ci = false
source = "benchmarks/adc757"
report_schema = "pops.adc757.heterogeneous-numerics.v1"
verifier = "benchmarks/adc757/verify.py"
requires_real_device = true
requires_distinct_device_per_rank = true
minimum_mpi_ranks = 2
minimum_streams = 2
requires_stream_overlap = true
requires_restart_rollback_and_ledger_parity = true
requires_exact_installed_wheels = true
requires_pops_doctor = true
runtime_scenario = "adc757_amr_advection_runtime_v1"
runtime_modes = ["serial", "threaded", "gpu", "gpu_mpi"]
required_runtime_authorities = ["cell_local_time", "amr_rebalance_migration"]
scenarios = ["prepared_local_time", "cost_aware_load_balance"]
metrics = [
  "time_to_solution_seconds",
  "throughput_cell_updates_per_second",
  "memory_traffic_bytes",
  "kernel_launches",
  "task_count",
  "communication_bytes",
  "communication_seconds",
  "fallback_count",
  "useful_work_cell_updates",
  "imbalance_ratio",
  "migration_bytes",
  "migration_seconds",
]
job_script = "benchmarks/romeo/adc757_heterogeneous_numerics.sbatch"
submit_script = "benchmarks/romeo/submit_adc757_heterogeneous_numerics.sh"
