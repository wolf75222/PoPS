# Local CPU development environment. setup_env.sh selects the platform compiler
# and prevents accidental CUDA Kokkos resolution; use --cuda to opt in.
name: pops
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - cmake>=3.27
  - ninja
  - ccache
  - scikit-build-core>=0.10
  - numpy>=1.24
  - pybind11>=2.13,<3
  - kokkos
  # Keep the MPI/HDF5 ABI pair aligned with the ParaView integration.
  - mpich=4.1.2
  - mpi=1.0=mpich
  - mpi4py=4.1.2
  - "hdf5=1.14.3=mpi_mpich_*"
  - zlib
  - llvm-openmp
  - fftw
